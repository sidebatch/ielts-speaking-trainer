orm:uppercase;color:var(--green);margin-bottom:10px}.answerTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.mini{display:flex;gap:5px}.mini button{border:1px solid var(--line);background:#f1f2ee;border-radius:9px;padding:6px 8px;font-size:11px;font-weight:800}.mini button.on{background:var(--green);color:#fff;border-color:var(--green)}.aen{font-size:18px;line-height:1.65;margin:14px 0 0}

Sentence{font-size:21px;line-height:1.55}.trainerPrompt{padding:24px 0 18px}.trainerChoiceRow{grid-template-columns:1fr}}.toast{position:fixed;z-index:99;bottom:90px;left:50%;transform:translateX(-50%);background:#20231f;color:#fff;border-radius:12px;padding:10px 13px;font-size:12px}

  <script>const DATA={"meta":{"title":"IELTS Speaking 2026 Sep-Dec Korean Learner Content","season":"2026 Sep-Dec","question_source":"Scorefactory PDF (Updated 2026-09-12; IELTSBro-based)","target_users":"Korean learners","answer_levels":["5.0","6.0","7.0"],"content_style":{"answer_paths":"1-3 natural paths depending on the question","spoken_english":true,"avoid_forced_yes_no":true,"allow_useful_pattern_repetition_across_topics":true,"avoid_repetitive_structure_within_same_topic":true,"band7_not_just_longer":true,"tts_typing_friendly":true},"content_version":"v2-part1-complete","completed_topics":13,"completed_questions":53,"part1_status":"complete","bilingual_answers":true,"answer_schema":{"5.0":{"en":"English sample answer","ko":"Natural Korean meaning"},"6.0":{"en":"English sample answer","ko":"Natural Korean meaning"},"7.0":{"en":"English sample answer","ko":"Natural Korean meaning"}},"korean_translation_style":"Natural Korean meaning-first translation, not rigid word-for-word translation","updated":"2026-09-12","question_language":["en","ko"],"answer_language":["en","ko"],"app_content_version":"v1.0-part1","question_count":53,"topic_count":13},"topics":[{"id":"computers-and-tablets","topic":{"en":"Computers and tablets","ko":"컴퓨터와 태블릿"},"status":"approved","questions":[{"id":"computers-and-tablets-q1","question":{"en":"Would you like to use a computer or tablet?","ko":"컴퓨터나 태블릿을 사용하고 싶나요?"},"paths":[{"id":"computer","label":{"en":"Computer","ko":"컴퓨터"},"answers":{"5.0":{"en":"I'd probably choose a computer. It's easier for me to type and do my work.","ko":"저라면 아마 컴퓨터를 고를 것 같아요. 타이핑하거나 일을 하기 더 편하거든요."},"6.0":{"en":"I'd probably go with a computer. I type quite a lot, so having a proper keyboard is much more convenient for me.","ko":"저라면 아마 컴퓨터를 선택할 것 같아요. 타이핑을 꽤 많이 해서 제대로 된 키보드가 있는 게 훨씬 편해요."},"7.0":{"en":"I'd definitely choose a computer for most things. I do a lot of typing, so a proper keyboard and a bigger screen make everything easier, especially when I'm working or studying.","ko":"대부분의 일에는 확실히 컴퓨터를 고를 것 같아요. 타이핑을 많이 하는 편이라 제대로 된 키보드와 큰 화면이 있으면, 특히 일하거나 공부할 때 훨씬 편하거든요."}}},{"id":"tablet","label":{"en":"Tablet","ko":"태블릿"},"answers":{"5.0":{"en":"I'd choose a tablet. It's light and easy to carry around.","ko":"저라면 태블릿을 고를 것 같아요. 가볍고 들고 다니기 편하니까요."},"6.0":{"en":"I'd probably use a tablet more. It's easy to carry, and I mainly use it for watching videos and reading.","ko":"아마 태블릿을 더 많이 사용할 것 같아요. 가지고 다니기 쉽고, 주로 영상 보거나 책 읽을 때 쓰거든요."},"7.0":{"en":"I'd probably go with a tablet because I like being able to use it anywhere. It's great for reading, watching videos, and doing simple things when I don't want to sit at a desk.","ko":"아마 태블릿을 선택할 것 같아요. 어디서든 편하게 쓸 수 있는 점이 좋거든요. 책을 읽거나 영상을 보거나, 책상에 앉고 싶지 않을 때 간단한 일을 하기에 좋아요."}}},{"id":"both_depends","label":{"en":"Both / It depends","ko":"둘 다 / 상황에 따라"},"answers":{"5.0":{"en":"I like both. I use a computer for work and a tablet for watching videos.","ko":"둘 다 좋아해요. 일할 때는 컴퓨터를 쓰고, 영상 볼 때는 태블릿을 써요."},"6.0":{"en":"It depends on what I'm doing. I prefer a computer for work, but a tablet is more convenient when I just want to relax or watch something.","ko":"뭘 하느냐에 따라 달라요. 일할 때는 컴퓨터를 더 좋아하지만, 그냥 쉬거나 뭔가 볼 때는 태블릿이 더 편해요."},"7.0":{"en":"It really depends on the situation. I use a computer when I need to type or focus, but a tablet is much more convenient when I'm travelling or just browsing at home.","ko":"상황에 따라 정말 달라요. 타이핑을 하거나 집중해야 할 때는 컴퓨터를 쓰고, 여행 중이거나 집에서 간단히 인터넷을 볼 때는 태블릿이 훨씬 편해요."}}}]},{"id":"computers-and-tablets-q2","question":{"en":"In what conditions would you use a computer or tablet?","ko":"어떤 상황에서 컴퓨터나 태블릿을 사용하나요?"},"paths":[{"id":"work_study","label":{"en":"Work / Study","ko":"일 / 공부"},"answers":{"5.0":{"en":"I usually use a computer when I need to study or do something for work.","ko":"공부를 해야 하거나 일을 해야 할 때 보통 컴퓨터를 사용해요."},"6.0":{"en":"I mostly use a computer when I need to write something, study, or do work that takes a lot of concentration.","ko":"글을 쓰거나 공부를 하거나, 집중이 많이 필요한 일을 할 때 주로 컴퓨터를 사용해요."},"7.0":{"en":"I usually use a computer when I need to get some proper work done, like writing something or studying. It's just easier for me to focus with a bigger screen and a keyboard.","ko":"글을 쓰거나 공부하는 것처럼 제대로 뭔가 해야 할 때 보통 컴퓨터를 사용해요. 큰 화면과 키보드가 있으면 집중하기가 더 쉽거든요."}}},{"id":"relax_travel","label":{"en":"Relaxing / Travelling","ko":"휴식 / 여행 중"},"answers":{"5.0":{"en":"I use a tablet when I'm relaxing at home or travelling.","ko":"집에서 쉬거나 여행할 때 태블릿을 사용해요."},"6.0":{"en":"I usually use a tablet when I'm travelling or just relaxing at home. It's easy to carry and good for watching videos.","ko":"여행할 때나 집에서 그냥 쉴 때 보통 태블릿을 사용해요. 가지고 다니기 쉽고 영상 보기에도 좋아요."},"7.0":{"en":"I tend to use a tablet when I'm travelling or when I just want to relax. It's much easier to carry around, and I don't really need a full computer if I'm only watching something or reading.","ko":"여행할 때나 그냥 쉬고 싶을 때 태블릿을 쓰는 편이에요. 들고 다니기 훨씬 편하고, 영상이나 책만 볼 거라면 굳이 컴퓨터까지 필요하지 않거든요."}}}]},{"id":"computers-and-tablets-q3","question":{"en":"When was the first time you used a computer or tablet?","ko":"컴퓨터나 태블릿을 처음 사용한 것은 언제였나요?"},"paths":[{"id":"school","label":{"en":"At school","ko":"학교에서"},"answers":{"5.0":{"en":"I first used a computer when I was in elementary school. We used it in class sometimes.","ko":"처음 컴퓨터를 사용한 건 초등학교 때였어요. 가끔 수업 시간에 사용했어요."},"6.0":{"en":"I think the first time I used a computer was in elementary school. We had a computer class, and I remember learning how to type and use simple programs.","ko":"처음 컴퓨터를 사용한 건 아마 초등학교 때였던 것 같아요. 컴퓨터 수업이 있었고, 타이핑하는 법과 간단한 프로그램 쓰는 법을 배웠던 게 기억나요."},"7.0":{"en":"I can't remember the exact age, but I think I first used a computer in elementary school. We had basic computer classes, and that was probably when I started getting comfortable with using one.","ko":"정확히 몇 살이었는지는 기억나지 않지만, 처음 컴퓨터를 사용한 건 아마 초등학교 때였던 것 같아요. 기본적인 컴퓨터 수업이 있었고, 그때부터 컴퓨터 사용에 익숙해졌던 것 같아요."}}},{"id":"home","label":{"en":"At home","ko":"집에서"},"answers":{"5.0":{"en":"I first used a computer at home when I was a child. My family had one.","ko":"어릴 때 집에서 처음 컴퓨터를 사용했어요. 집에 컴퓨터가 한 대 있었어요."},"6.0":{"en":"I first used a computer at home when I was pretty young. My family had one, and I mostly used it to play games and look things up.","ko":"꽤 어릴 때 집에서 처음 컴퓨터를 사용했어요. 가족용 컴퓨터가 있었고, 주로 게임을 하거나 뭔가를 찾아볼 때 썼어요."},"7.0":{"en":"I first started using a computer at home when I was quite young. At first, I mainly used it for games, but over time I started using it for schoolwork and other things as well.","ko":"아주 어릴 때부터 집에서 컴퓨터를 쓰기 시작했어요. 처음에는 주로 게임을 했지만, 시간이 지나면서 학교 과제나 다른 일에도 쓰게 됐어요."}}},{"id":"dont_remember","label":{"en":"I don't remember exactly","ko":"정확히 기억나지 않음"},"answers":{"5.0":{"en":"I don't really remember. I was probably quite young when I first used one.","ko":"잘 기억나지는 않아요. 아마 꽤 어릴 때 처음 사용했을 거예요."},"6.0":{"en":"I honestly can't remember the first time. Computers were already common when I was growing up, so I started using one pretty early.","ko":"솔직히 처음 사용한 때는 기억이 안 나요. 제가 자랄 때는 이미 컴퓨터가 흔했기 때문에 꽤 어릴 때부터 사용했던 것 같아요."},"7.0":{"en":"I can't remember a specific first time, to be honest. Computers were already a normal part of everyday life when I was growing up, so I probably started using one without really thinking about it.","ko":"솔직히 특정한 첫 경험은 기억나지 않아요. 제가 자랄 때는 이미 컴퓨터가 일상적인 것이어서, 특별히 의식하지 않은 채 자연스럽게 사용하기 시작했던 것 같아요."}}}]},{"id":"computers-and-tablets-q4","question":{"en":"What would your life be like without computers or tablets?","ko":"컴퓨터나 태블릿이 없다면 생활이 어떨 것 같나요?"},"paths":[{"id":"very_difficult","label":{"en":"Very difficult","ko":"매우 어려움"},"answers":{"5.0":{"en":"It would be really difficult. I use a computer almost every day for work and other things.","ko":"정말 불편할 것 같아요. 저는 거의 매일 일이나 다른 용도로 컴퓨터를 사용해요."},"6.0":{"en":"It would be pretty difficult for me. I use a computer for work, studying, shopping, and even simple things like checking information online.","ko":"저한테는 꽤 힘들 것 같아요. 일, 공부, 쇼핑, 심지어 인터넷으로 간단한 정보를 확인할 때도 컴퓨터를 사용하거든요."},"7.0":{"en":"My daily life would be a lot less convenient. I rely on computers for work, studying, banking, and even planning things, so I'd probably have to spend much more time doing basic tasks.","ko":"일상이 훨씬 불편해질 것 같아요. 일, 공부, 은행 업무, 계획 세우기까지 컴퓨터에 많이 의존하고 있어서, 기본적인 일을 하는 데도 훨씬 더 많은 시간이 들 것 같아요."}}},{"id":"manageable","label":{"en":"Manageable, but inconvenient","ko":"살 수는 있지만 불편함"},"answers":{"5.0":{"en":"I think I could live without them, but it would be inconvenient.","ko":"없어도 살 수는 있을 것 같지만 불편할 것 같아요."},"6.0":{"en":"I could probably manage without them, but a lot of things would take more time. I'd have to use my phone or do more things in person.","ko":"아마 없어도 어떻게든 지낼 수는 있겠지만, 많은 일에 시간이 더 걸릴 것 같아요. 휴대폰을 쓰거나 직접 가서 처리해야 하는 일이 더 많아질 것 같아요."},"7.0":{"en":"I think I'd manage, but life would definitely be less convenient. A lot of things I can do in a few minutes online would suddenly take much more time and effort.","ko":"지낼 수는 있겠지만 생활이 확실히 덜 편해질 것 같아요. 지금은 온라인에서 몇 분이면 할 수 있는 일도 갑자기 훨씬 더 많은 시간과 노력이 필요해질 거예요."}}},{"id":"not_huge_problem","label":{"en":"Not a huge problem","ko":"큰 문제는 아님"},"answers":{"5.0":{"en":"It wouldn't be too bad for me. I use my phone more often anyway.","ko":"저한테는 그렇게 큰 문제는 아닐 것 같아요. 어차피 휴대폰을 더 자주 쓰거든요."},"6.0":{"en":"I don't think it would change my life that much because I use my phone for most everyday things.","ko":"일상적인 대부분의 일은 휴대폰으로 하기 때문에 제 생활이 크게 달라질 것 같지는 않아요."},"7.0":{"en":"It probably wouldn't affect me as much as some people because I already do a lot on my phone. I'd miss having a bigger screen for certain things, but I think I could adjust.","ko":"이미 휴대폰으로 많은 일을 하고 있어서 다른 사람들만큼 큰 영향을 받지는 않을 것 같아요. 어떤 일을 할 때는 큰 화면이 아쉽겠지만, 적응할 수 있을 것 같아요."}}}]},{"id":"computers-and-tablets-q5","question":{"en":"In what conditions would it be difficult for you to use a computer or tablet?","ko":"어떤 상황에서 컴퓨터나 태블릿을 사용하기 어려울 것 같나요?"},"paths":[{"id":"travelling_moving","label":{"en":"Travelling / Moving around","ko":"여행 / 이동 중"},"answers":{"5.0":{"en":"It would be difficult when I'm travelling or standing somewhere. A computer isn't easy to use in that situation.","ko":"여행 중이거나 서 있는 상황에서는 사용하기 어려울 것 같아요. 그런 상황에서는 컴퓨터를 쓰기가 쉽지 않으니까요."},"6.0":{"en":"It would be difficult when I'm travelling or moving around a lot. I usually need somewhere to sit down and put the device properly.","ko":"여행 중이거나 계속 이동해야 할 때 사용하기 어려울 것 같아요. 보통 앉을 자리와 기기를 제대로 놓을 공간이 필요하거든요."},"7.0":{"en":"I'd find it difficult to use one when I'm on the move, especially in a crowded place. With a laptop, I usually need a proper seat and enough space to use it comfortably.","ko":"이동 중에는 사용하기 어려울 것 같아요. 특히 사람이 많은 곳에서는 더 그래요. 노트북을 편하게 쓰려면 보통 제대로 앉을 자리와 충분한 공간이 필요해요."}}},{"id":"internet_battery","label":{"en":"No internet / Low battery","ko":"인터넷 없음 / 배터리 부족"},"answers":{"5.0":{"en":"It's difficult when there is no internet or the battery is low.","ko":"인터넷이 없거나 배터리가 부족할 때 사용하기 어려워요."},"6.0":{"en":"I find it difficult when the internet connection is poor or the battery is almost dead. A lot of the things I do need to be online.","ko":"인터넷 연결이 좋지 않거나 배터리가 거의 없을 때 사용하기 어려워요. 제가 하는 일의 많은 부분이 인터넷 연결을 필요로 하거든요."},"7.0":{"en":"Poor internet is probably the biggest problem for me. Most of what I do depends on being connected, so even if the device itself works fine, it can become pretty useless without a stable connection.","ko":"저한테는 인터넷 연결이 좋지 않은 게 가장 큰 문제인 것 같아요. 제가 하는 대부분의 일이 인터넷에 연결되어 있어야 해서, 기기 자체는 잘 작동해도 안정적인 연결이 없으면 거의 쓸모가 없어질 수 있어요."}}},{"id":"long_typing_tablet","label":{"en":"Long typing on a tablet","ko":"태블릿으로 긴 타이핑"},"answers":{"5.0":{"en":"It's difficult for me to type a lot on a tablet.","ko":"태블릿으로 타이핑을 많이 하는 건 저한테 어려워요."},"6.0":{"en":"I find tablets difficult to use when I need to type for a long time. The screen keyboard isn't very comfortable for me.","ko":"오랫동안 타이핑해야 할 때는 태블릿을 쓰기 불편해요. 화면 키보드가 저한테는 그다지 편하지 않거든요."},"7.0":{"en":"I don't mind using a tablet for simple things, but I find it frustrating when I have to type a lot. A touchscreen keyboard is fine for short messages, but for longer work I definitely prefer a proper keyboard.","ko":"간단한 일을 할 때 태블릿을 쓰는 건 괜찮지만, 타이핑을 많이 해야 하면 답답해요. 짧은 메시지를 쓸 때는 터치 키보드도 괜찮지만, 긴 작업을 할 때는 확실히 제대로 된 키보드를 더 선호해요."}}}]}]},{"id":"collecting-things","topic":{"en":"Collecting things","ko":"물건 수집"},"status":"approved","questions":[{"id":"collecting-things-q1","question":{"en":"Where do you usually keep things you need?","ko":"필요한 물건들은 보통 어디에 보관하나요?"},"paths":[{"id":"one_place","label":{"en":"In one place","ko":"한곳에"},"answers":{"5.0":{"en":"I usually keep important things in my room. I try to put them in the same place so I can find them easily.","ko":"중요한 물건은 보통 제 방에 둬요. 찾기 쉽도록 항상 같은 곳에 두려고 해요."},"6.0":{"en":"I usually keep things I use every day in the same place, like on my desk or in a drawer. It saves me time because I don't have to look for them.","ko":"매일 쓰는 물건은 보통 책상 위나 서랍처럼 같은 곳에 둬요. 찾으러 다닐 필요가 없어서 시간이 절약돼요."},"7.0":{"en":"I try to keep everyday things in fixed places. For example, I leave my keys near the door and keep important documents in one drawer. Otherwise, I know I'd waste time looking for them.","ko":"평소 자주 쓰는 물건은 정해진 자리에 두려고 해요. 예를 들면 열쇠는 현관 근처에 두고 중요한 서류는 한 서랍에 모아둬요. 안 그러면 찾느라 시간을 많이 쓰게 되거든요."}}},{"id":"where_convenient","label":{"en":"Wherever convenient","ko":"편한 곳에"},"answers":{"5.0":{"en":"I don't really have one place. I just keep things where I use them most.","ko":"딱 한 곳에 두는 건 아니에요. 그냥 가장 자주 사용하는 곳 근처에 둬요."},"6.0":{"en":"It depends on what it is. I keep some things in my room and others near the front door, especially things I need when I go out.","ko":"물건에 따라 달라요. 어떤 건 방에 두고, 외출할 때 필요한 건 현관 근처에 두기도 해요."},"7.0":{"en":"I don't have one specific place for everything. I tend to leave things wherever they're most useful, so my keys stay near the door while work-related stuff usually stays on my desk.","ko":"모든 물건을 한곳에 두지는 않아요. 가장 쓰기 편한 곳에 두는 편이라, 열쇠는 현관 근처에 두고 일 관련 물건은 보통 책상 위에 둬요."}}}]},{"id":"collecting-things-q2","question":{"en":"Would you keep old things for a long time? Why?","ko":"오래된 물건을 오랫동안 보관하는 편인가요? 왜 그런가요?"},"paths":[{"id":"memories","label":{"en":"Yes, for memories","ko":"네, 추억 때문에"},"answers":{"5.0":{"en":"Yes, sometimes. I like keeping things that remind me of important memories.","ko":"네, 가끔 그래요. 중요한 추억이 떠오르는 물건은 보관하는 걸 좋아해요."},"6.0":{"en":"Yeah, if something has a special memory attached to it, I usually keep it. I don't like throwing away things that mean something to me.","ko":"네. 특별한 추억이 담긴 물건이라면 보통 간직해요. 저한테 의미가 있는 물건을 버리는 건 별로 좋아하지 않아요."},"7.0":{"en":"I do if the item has some personal meaning. I'm not the type to keep everything, but if something reminds me of a person or a particular time in my life, I find it hard to throw away.","ko":"개인적으로 의미가 있는 물건이라면 간직하는 편이에요. 모든 걸 다 모아두는 사람은 아니지만, 누군가나 인생의 특정 시기를 떠올리게 하는 물건은 버리기가 어렵더라고요."}}},{"id":"less_clutter","label":{"en":"No, I prefer less clutter","ko":"아니요, 물건이 적은 게 좋음"},"answers":{"5.0":{"en":"Not really. If I don't use something anymore, I usually throw it away.","ko":"별로요. 더 이상 쓰지 않는 물건이면 보통 버려요."},"6.0":{"en":"Not really. I don't like having too many things at home, so if I haven't used something for a long time, I usually get rid of it.","ko":"별로요. 집에 물건이 너무 많은 걸 좋아하지 않아서 오랫동안 쓰지 않은 건 보통 정리해요."},"7.0":{"en":"Not usually. I prefer keeping my place fairly simple, so I tend to get rid of things once I know I'm not going to use them again. I might keep a few meaningful items, though.","ko":"보통은 아니에요. 집을 비교적 깔끔하고 단순하게 유지하는 걸 좋아해서 다시 쓰지 않을 것 같으면 정리하는 편이에요. 그래도 의미 있는 물건 몇 개는 남겨둘 수 있어요."}}}]},{"id":"collecting-things-q3","question":{"en":"Are there any things you have kept from your childhood?","ko":"어린 시절부터 지금까지 간직하고 있는 물건이 있나요?"},"paths":[{"id":"photos_small_items","label":{"en":"Yes, photos or small items","ko":"네, 사진이나 작은 물건"},"answers":{"5.0":{"en":"Yes. I still have some old photos and a few small things from when I was a child.","ko":"네. 어릴 때 찍은 오래된 사진이랑 작은 물건 몇 개를 아직 가지고 있어요."},"6.0":{"en":"Yeah, I still have a few things, mainly old photos and some small items from school. I don't use them, but they're nice to look at sometimes.","ko":"네, 아직 몇 가지 있어요. 주로 오래된 사진이나 학교 다닐 때 쓰던 작은 물건들이에요. 쓰지는 않지만 가끔 보면 좋아요."},"7.0":{"en":"I still have a few things from my childhood, mostly photos and small keepsakes. They're not valuable or anything, but they bring back memories, so I've never really wanted to get rid of them.","ko":"어릴 때부터 가지고 있는 물건이 몇 개 있어요. 대부분 사진이나 작은 기념품이에요. 값비싼 건 아니지만 추억이 떠올라서 굳이 버리고 싶지는 않았어요."}}},{"id":"not_much","label":{"en":"Not much","ko":"거의 없음"},"answers":{"5.0":{"en":"Not really. I moved several times, so I don't have many things from my childhood.","ko":"별로 없어요. 이사를 여러 번 해서 어린 시절 물건이 많이 남아 있지 않아요."},"6.0":{"en":"I don't have much left, actually. My family moved a few times, and a lot of old things were thrown away over the years.","ko":"사실 많이 남아 있지는 않아요. 가족이 몇 번 이사하면서 오래된 물건들을 많이 버렸거든요."},"7.0":{"en":"Very little, to be honest. I've moved quite a few times, so most of my childhood belongings disappeared along the way. I still have some photos, but that's about it.","ko":"솔직히 거의 없어요. 이사를 꽤 여러 번 해서 어린 시절 물건 대부분이 그 과정에서 없어졌어요. 사진 몇 장 정도만 남아 있어요."}}}]},{"id":"collecting-things-q4","question":{"en":"Do you collect things?","ko":"무언가를 수집하나요?"},"paths":[{"id":"yes","label":{"en":"Yes","ko":"네"},"answers":{"5.0":{"en":"Yeah, I collect a few things. I like keeping items that I find interesting.","ko":"네, 몇 가지 모아요. 제가 흥미롭다고 느끼는 물건을 보관하는 걸 좋아해요."},"6.0":{"en":"I do, but nothing too serious. I like collecting small things from places I've visited because they remind me of the trip.","ko":"모으긴 하지만 아주 본격적이지는 않아요. 여행 갔던 곳에서 작은 물건을 모으는 걸 좋아하는데, 그 여행을 떠올리게 해주거든요."},"7.0":{"en":"Kind of. I wouldn't call myself a serious collector, but I like keeping small items from places I've been. It's nice to have something physical that reminds me of a trip.","ko":"조금은 그래요. 진지한 수집가라고 할 정도는 아니지만, 다녀온 곳에서 작은 물건을 가져와 보관하는 걸 좋아해요. 여행을 떠올릴 수 있는 실제 물건이 있다는 게 좋거든요."}}},{"id":"no","label":{"en":"No","ko":"아니요"},"answers":{"5.0":{"en":"No, not really. I don't like keeping things I don't need.","ko":"아니요, 별로요. 필요 없는 물건을 계속 가지고 있는 걸 좋아하지 않아요."},"6.0":{"en":"Not really. I've never been that interested in collecting things, and I prefer having less stuff around the house.","ko":"별로요. 물건을 모으는 데 큰 관심이 없고, 집에 물건이 적은 편을 더 좋아해요."},"7.0":{"en":"Not particularly. I can understand why people enjoy collecting things, but personally, I don't like having too much stuff around. I'd rather keep only the things I actually use.","ko":"딱히 그렇지는 않아요. 사람들이 왜 수집을 좋아하는지는 이해하지만, 개인적으로는 집에 물건이 너무 많은 걸 좋아하지 않아요. 실제로 쓰는 것만 두는 편이 더 좋아요."}}}]}]},{"id":"lost-and-found","topic":{"en":"Lost and found","ko":"분실물"},"status":"approved","questions":[{"id":"lost-and-found-q1","question":{"en":"Have you ever lost your keys?","ko":"열쇠를 잃어버린 적이 있나요?"},"paths":[{"id":"yes","label":{"en":"Yes","ko":"네"},"answers":{"5.0":{"en":"Yes, I have. I lost my keys once and had to look for them for a long time.","ko":"네, 있어요. 한 번 열쇠를 잃어버려서 한참 찾은 적이 있어요."},"6.0":{"en":"Yeah, I have. I once left my keys somewhere and didn't notice until I got home. Luckily, I found them later.","ko":"네, 있어요. 한 번 어딘가에 열쇠를 두고 온 걸 집에 도착해서야 알았어요. 다행히 나중에 찾았어요."},"7.0":{"en":"Yeah, once or twice. The worst time was when I got home and realized my keys weren't in my pocket. I had to go back and retrace my steps, but luckily I found them.","ko":"네, 한두 번 있어요. 가장 곤란했던 건 집에 도착해서 주머니에 열쇠가 없다는 걸 알았을 때예요. 다시 지나온 길을 돌아가 봤고, 다행히 찾았어요."}}},{"id":"no_rarely","label":{"en":"No / Rarely","ko":"아니요 / 거의 없음"},"answers":{"5.0":{"en":"No, I don't think so. I usually keep my keys in the same place.","ko":"아니요, 없는 것 같아요. 보통 열쇠를 항상 같은 곳에 둬요."},"6.0":{"en":"I don't think I've ever completely lost them. I'm quite careful with my keys, and I usually keep them in the same pocket or bag.","ko":"완전히 잃어버린 적은 없는 것 같아요. 열쇠는 꽤 조심해서 챙기는 편이고, 보통 같은 주머니나 가방에 넣어요."},"7.0":{"en":"Not that I can remember. I'm actually quite careful with things like keys because I always put them in the same pocket. That habit has probably saved me a few times.","ko":"기억나는 한은 없어요. 열쇠 같은 물건은 항상 같은 주머니에 넣기 때문에 꽤 신경 써서 챙기는 편이에요. 그 습관 덕분에 몇 번은 잃어버릴 뻔한 걸 막았던 것 같아요."}}}]},{"id":"lost-and-found-q2","question":{"en":"Will you post on social media if you lose your item?","ko":"물건을 잃어버리면 소셜미디어에 글을 올릴 건가요?"},"paths":[{"id":"yes_if_important","label":{"en":"Yes, if it's important","ko":"네, 중요한 물건이라면"},"answers":{"5.0":{"en":"Yes, if it is something important. Someone might see the post and help me find it.","ko":"네, 중요한 물건이라면 그럴 것 같아요. 누군가 게시물을 보고 찾는 데 도움을 줄 수도 있으니까요."},"6.0":{"en":"I probably would if the item was valuable or difficult to replace. Social media can reach a lot of people quickly.","ko":"값이 비싸거나 다시 구하기 어려운 물건이라면 아마 올릴 것 같아요. 소셜미디어를 이용하면 많은 사람에게 빠르게 알릴 수 있으니까요."},"7.0":{"en":"If it was something important, definitely. Posting online is a quick way to reach people in the area, so there's always a chance that someone has found it.","ko":"중요한 물건이라면 확실히 올릴 것 같아요. 온라인에 올리면 그 주변 사람들에게 빠르게 알릴 수 있어서 누군가 이미 주웠을 가능성도 확인할 수 있으니까요."}}},{"id":"other_methods_first","label":{"en":"No, other methods first","ko":"아니요, 다른 방법부터"},"answers":{"5.0":{"en":"Probably not. I would check the places I visited first.","ko":"아마 안 할 것 같아요. 먼저 제가 갔던 곳들을 확인해볼 것 같아요."},"6.0":{"en":"Probably not at first. I'd contact the place where I think I lost it and check nearby before posting anything online.","ko":"처음부터 올리지는 않을 것 같아요. 잃어버렸다고 생각되는 장소에 연락하고 주변을 먼저 확인한 뒤에 온라인에 올릴 것 같아요."},"7.0":{"en":"Social media probably wouldn't be my first choice. I'd retrace my steps and contact any places I'd visited first. If that didn't work, then I might post about it.","ko":"소셜미디어가 첫 번째 선택은 아닐 것 같아요. 먼저 지나온 길을 다시 확인하고, 방문했던 장소들에 연락해볼 거예요. 그래도 못 찾으면 그때 온라인에 올릴 수도 있어요."}}}]},{"id":"lost-and-found-q3","question":{"en":"Have you ever lost things?","ko":"물건을 잃어버린 적이 있나요?"},"paths":[{"id":"small_things","label":{"en":"Yes, small things","ko":"네, 작은 물건들"},"answers":{"5.0":{"en":"Yes, sometimes. I've lost small things like earphones or cards before.","ko":"네, 가끔 있어요. 이어폰이나 카드 같은 작은 물건을 잃어버린 적이 있어요."},"6.0":{"en":"Yeah, a few times. I mostly lose small things like cards or earphones because they're easy to leave somewhere without noticing.","ko":"네, 몇 번 있어요. 주로 카드나 이어폰처럼 작아서 어디에 두고 와도 바로 알아차리기 어려운 물건을 잃어버려요."},"7.0":{"en":"Yeah, mostly small things. I've misplaced cards, earphones, and things like that before. Usually it's because I put something down for a second and completely forget about it.","ko":"네, 대부분 작은 물건들이에요. 카드나 이어폰 같은 걸 잘못 둔 적이 있어요. 보통 잠깐 내려놓고 완전히 잊어버려서 그래요."}}},{"id":"rarely","label":{"en":"Very rarely","ko":"거의 없음"},"answers":{"5.0":{"en":"Not very often. I usually check my things before I leave somewhere.","ko":"자주는 아니에요. 어디서 나가기 전에 보통 제 물건을 한 번 확인해요."},"6.0":{"en":"Very rarely. I've made a habit of checking my pockets and bag before I leave, so I don't lose things that often.","ko":"아주 드물어요. 나가기 전에 주머니와 가방을 확인하는 습관이 생겨서 요즘은 물건을 자주 잃어버리지 않아요."},"7.0":{"en":"Hardly ever these days. I used to be a bit careless, but now I automatically check my phone, wallet, and keys whenever I leave somewhere.","ko":"요즘은 거의 없어요. 예전에는 조금 덜렁대는 편이었지만, 지금은 어디서 나갈 때 자동으로 휴대폰, 지갑, 열쇠를 확인해요."}}}]},{"id":"lost-and-found-q4","question":{"en":"Do you report to the police when finding something lost by others? Why?","ko":"다른 사람이 잃어버린 물건을 발견하면 경찰에 신고하나요? 왜 그런가요?"},"paths":[{"id":"valuable_items","label":{"en":"For valuable items","ko":"귀중품이라면"},"answers":{"5.0":{"en":"Yes, if it is something valuable. I think the owner may contact the police to find it.","ko":"네, 값비싼 물건이라면 경찰에 맡길 것 같아요. 주인이 찾으려고 경찰에 연락할 수도 있으니까요."},"6.0":{"en":"I would if it was something valuable, like a wallet or an expensive phone. The owner would probably be worried, so handing it in seems like the safest thing to do.","ko":"지갑이나 비싼 휴대폰처럼 값어치가 있는 물건이라면 그렇게 할 것 같아요. 주인도 많이 걱정할 테니 공식적인 곳에 맡기는 게 가장 안전해 보여요."},"7.0":{"en":"If it was clearly valuable, like a wallet or an expensive device, I probably would. I'd rather hand it over somewhere official than keep it with me and hope the owner somehow finds me.","ko":"지갑이나 비싼 전자기기처럼 분명히 중요한 물건이라면 아마 그렇게 할 것 같아요. 제가 가지고 있으면서 주인이 우연히 저를 찾기를 기다리는 것보다 공식적인 곳에 맡기는 게 낫다고 생각해요."}}},{"id":"depends_location","label":{"en":"Depends where I find it","ko":"발견한 장소에 따라"},"answers":{"5.0":{"en":"It depends. If I find something in a store, I would give it to the staff.","ko":"상황에 따라 달라요. 가게 안에서 주웠다면 직원에게 줄 것 같아요."},"6.0":{"en":"It depends on where I find it. If it's inside a mall or restaurant, I'd probably give it to the staff instead of going to the police.","ko":"어디서 발견했느냐에 따라 달라요. 쇼핑몰이나 식당 안이라면 경찰보다는 그곳 직원에게 맡길 것 같아요."},"7.0":{"en":"It really depends on the situation. If I found something inside a store or on public transport, I'd hand it to the staff there. I'd only go to the police if there wasn't a more obvious place to leave it.","ko":"상황에 따라 정말 달라요. 가게 안이나 대중교통에서 발견했다면 그곳 직원에게 맡길 거예요. 맡길 만한 더 적절한 곳이 없을 때만 경찰에 갈 것 같아요."}}}]},{"id":"lost-and-found-q5","question":{"en":"What will you do if you find something lost by others?","ko":"다른 사람이 잃어버린 물건을 발견하면 어떻게 할 건가요?"},"paths":[{"id":"hand_it_in","label":{"en":"Hand it in","ko":"맡기기"},"answers":{"5.0":{"en":"I would give it to the staff or the police. That would make it easier for the owner to find it.","ko":"직원이나 경찰에게 맡길 것 같아요. 그러면 주인이 찾기 더 쉬울 테니까요."},"6.0":{"en":"I'd probably hand it in somewhere nearby, like a customer service desk or police station, depending on where I found it.","ko":"어디서 주웠느냐에 따라 근처 고객센터나 경찰서 같은 곳에 맡길 것 같아요."},"7.0":{"en":"I'd try to hand it in somewhere that makes sense. If I found it in a mall, for example, I'd take it to customer service because that's probably the first place the owner would check.","ko":"상황에 맞는 곳에 맡기려고 할 것 같아요. 예를 들어 쇼핑몰에서 주웠다면 고객센터에 가져갈 거예요. 주인이 가장 먼저 확인할 만한 곳이니까요."}}},{"id":"contact_owner","label":{"en":"Try to contact the owner","ko":"주인에게 연락 시도"},"answers":{"5.0":{"en":"If I can find the owner's information, I would try to contact them.","ko":"주인의 정보를 찾을 수 있다면 직접 연락해보려고 할 것 같아요."},"6.0":{"en":"If there was an easy way to identify the owner, I'd try to contact them directly. Otherwise, I'd hand the item in somewhere.","ko":"주인을 쉽게 확인할 방법이 있다면 직접 연락해볼 것 같아요. 그렇지 않으면 적절한 곳에 물건을 맡길 거예요."},"7.0":{"en":"I'd first see if there's a simple way to identify the owner, especially if it's something like a wallet with an ID inside. If not, I'd hand it in rather than keeping it with me.","ko":"먼저 주인을 확인할 수 있는 쉬운 방법이 있는지 볼 것 같아요. 특히 신분증이 든 지갑 같은 경우에는요. 확인하기 어렵다면 제가 가지고 있기보다 적절한 곳에 맡길 거예요."}}}]}]},{"id":"street-markets","topic":{"en":"Street markets","ko":"거리 시장"},"status":"approved","questions":[{"id":"street-markets-q1","question":{"en":"Are there many street markets in Korea?","ko":"한국에는 거리 시장이나 전통시장이 많이 있나요?"},"paths":[{"id":"yes","label":{"en":"Yes","ko":"네"},"answers":{"5.0":{"en":"Yes, there are quite a few. You can find them in many cities in Korea.","ko":"네, 꽤 많아요. 한국의 여러 도시에서 찾아볼 수 있어요."},"6.0":{"en":"Yeah, there are quite a lot, especially traditional markets. They usually sell food, clothes, and all kinds of everyday things.","ko":"네, 특히 전통시장이 꽤 많아요. 보통 음식, 옷, 그리고 여러 가지 생활용품을 팔아요."},"7.0":{"en":"Yeah, they're still pretty common, especially traditional markets. You can find them in most cities, and they're particularly popular for fresh food and inexpensive local dishes.","ko":"네, 아직도 꽤 흔해요. 특히 전통시장은 대부분의 도시에서 볼 수 있고, 신선한 식재료나 저렴한 지역 음식을 사러 많이 가요."}}},{"id":"fewer_than_before","label":{"en":"Fewer than before","ko":"예전보다 적음"},"answers":{"5.0":{"en":"There are some, but I think there were more in the past.","ko":"몇 군데 있긴 하지만 예전에는 더 많았던 것 같아요."},"6.0":{"en":"There are still quite a few, but I think they're less common than they used to be because more people shop online or go to large supermarkets now.","ko":"아직 꽤 많지만 예전보다는 덜 흔한 것 같아요. 요즘은 온라인 쇼핑을 하거나 대형마트에 가는 사람이 더 많으니까요."},"7.0":{"en":"They're definitely still around, but I don't think they're as important as they used to be. These days, a lot of people prefer supermarkets or online shopping because it's more convenient.","ko":"분명 아직 많이 남아 있지만 예전만큼 중요한 역할을 하지는 않는 것 같아요. 요즘은 편리해서 슈퍼마켓이나 온라인 쇼핑을 더 선호하는 사람이 많거든요."}}}]},{"id":"street-markets-q2","question":{"en":"When was the last time you went to a street market?","ko":"마지막으로 거리 시장이나 전통시장에 간 것은 언제였나요?"},"paths":[{"id":"recently","label":{"en":"Recently","ko":"최근에"},"answers":{"5.0":{"en":"I went to one a few weeks ago. I bought some food there.","ko":"몇 주 전에 갔어요. 거기서 음식을 좀 샀어요."},"6.0":{"en":"I went to one a couple of weeks ago with my family. We mainly went there to eat and buy a few things.","ko":"2주쯤 전에 가족과 함께 갔어요. 주로 먹으러 갔고 몇 가지 물건도 샀어요."},"7.0":{"en":"It was probably a few weeks ago. I went with my family, and we ended up spending more time eating than shopping because there were so many food stalls.","ko":"아마 몇 주 전이었던 것 같아요. 가족과 같이 갔는데 먹거리 가게가 많아서 쇼핑보다 먹는 데 더 많은 시간을 보냈어요."}}},{"id":"long_time_ago","label":{"en":"A long time ago","ko":"오래전에"},"answers":{"5.0":{"en":"It was quite a long time ago. I don't go to street markets very often.","ko":"꽤 오래됐어요. 저는 길거리 시장에 자주 가는 편은 아니에요."},"6.0":{"en":"Honestly, I can't remember exactly. It's probably been a few years because I normally shop at supermarkets or online.","ko":"솔직히 정확히 기억나지 않아요. 평소에는 슈퍼마켓이나 온라인에서 쇼핑해서 아마 몇 년은 된 것 같아요."},"7.0":{"en":"It's been quite a while, actually. I don't have a street market near where I live, so unless I'm visiting another area, I don't really have a reason to go to one.","ko":"사실 꽤 오래됐어요. 제가 사는 곳 근처에는 길거리 시장이 없어서 다른 지역에 갈 일이 없으면 딱히 갈 이유가 없어요."}}}]},{"id":"street-markets-q3","question":{"en":"Do you prefer to go shopping in the shopping mall or at the street market?","ko":"쇼핑몰과 거리 시장 중 어디에서 쇼핑하는 것을 더 좋아하나요?"},"paths":[{"id":"shopping_mall","label":{"en":"Shopping mall","ko":"쇼핑몰"},"answers":{"5.0":{"en":"I prefer shopping malls. They're more comfortable, and I can find many different shops in one place.","ko":"저는 쇼핑몰을 더 좋아해요. 더 편하고 한곳에서 여러 가게를 볼 수 있어요."},"6.0":{"en":"I usually prefer shopping malls because they're more convenient. I can shop, eat, and do other things without moving around too much.","ko":"보통 쇼핑몰을 더 선호해요. 한곳에서 쇼핑도 하고 밥도 먹고 다른 일도 할 수 있어서 편하거든요."},"7.0":{"en":"I'd probably choose a shopping mall for regular shopping. It's more convenient, especially when the weather is bad, and I like being able to find everything in one place.","ko":"평소 쇼핑을 한다면 아마 쇼핑몰을 고를 것 같아요. 특히 날씨가 안 좋을 때 더 편하고, 필요한 걸 한곳에서 찾을 수 있는 점이 좋아요."}}},{"id":"street_market","label":{"en":"Street market","ko":"거리 시장"},"answers":{"5.0":{"en":"I prefer street markets. The food is good, and the atmosphere is more interesting.","ko":"저는 길거리 시장을 더 좋아해요. 음식도 맛있고 분위기도 더 재미있어요."},"6.0":{"en":"I'd rather go to a street market, especially for food. It's usually more lively, and I enjoy walking around and trying different things.","ko":"특히 음식을 사러 갈 때는 길거리 시장을 더 가고 싶어요. 보통 더 활기차고 돌아다니면서 여러 가지를 먹어보는 게 재미있거든요."},"7.0":{"en":"For me, street markets are more enjoyable. I like the atmosphere, and there's usually something interesting to eat or look at. It feels less predictable than shopping in a mall.","ko":"저한테는 길거리 시장이 더 재미있어요. 분위기도 좋고 먹거나 구경할 만한 게 항상 뭔가 있어요. 쇼핑몰보다 조금 더 예상하지 못한 재미가 있는 느낌이에요."}}},{"id":"depends","label":{"en":"Depends on what I'm buying","ko":"사는 물건에 따라"},"answers":{"5.0":{"en":"It depends. I go to malls for clothes, but I prefer markets for food.","ko":"상황에 따라 달라요. 옷은 쇼핑몰에서 사고 음식은 시장에서 사는 걸 더 좋아해요."},"6.0":{"en":"It depends on what I need. I'd go to a mall for clothes or electronics, but for fresh food or snacks, I'd rather visit a market.","ko":"뭘 사느냐에 따라 달라요. 옷이나 전자제품은 쇼핑몰에 가겠지만, 신선한 음식이나 간식을 살 때는 시장에 가는 편이 더 좋아요."},"7.0":{"en":"It really depends on what I'm shopping for. If I need clothes or something specific, a mall is easier, but if I'm looking for food or just want to walk around, I'd much rather go to a street market.","ko":"무엇을 사려는지에 따라 정말 달라요. 옷이나 특정한 물건이 필요하면 쇼핑몰이 편하지만, 음식을 사거나 그냥 돌아다니고 싶다면 길거리 시장에 가는 걸 훨씬 더 좋아해요."}}}]},{"id":"street-markets-q4","question":{"en":"What do people usually buy at the street market?","ko":"사람들은 거리 시장에서 보통 무엇을 사나요?"},"paths":[{"id":"food_groceries","label":{"en":"Food and groceries","ko":"음식과 식료품"},"answers":{"5.0":{"en":"People usually buy food, like vegetables, fruit, meat, and snacks.","ko":"사람들은 보통 채소, 과일, 고기, 간식 같은 음식을 사요."},"6.0":{"en":"I think food is the main thing. People buy fresh vegetables, fruit, meat, and also ready-to-eat food from small stalls.","ko":"아마 음식이 가장 큰 것 같아요. 신선한 채소, 과일, 고기도 사고 작은 노점에서 바로 먹을 수 있는 음식도 사요."},"7.0":{"en":"Mostly food, I'd say. Traditional markets are a good place to buy fresh produce, meat, seafood, and all kinds of prepared food, so a lot of people go there specifically for groceries.","ko":"대부분 음식인 것 같아요. 전통시장은 신선한 농산물, 고기, 해산물, 여러 가지 조리된 음식을 사기 좋아서 장을 보러 일부러 가는 사람이 많아요."}}},{"id":"mix","label":{"en":"A mix of things","ko":"여러 가지"},"answers":{"5.0":{"en":"People buy many different things, like food, clothes, and household items.","ko":"사람들은 음식, 옷, 생활용품처럼 여러 가지를 사요."},"6.0":{"en":"You can buy all sorts of things. Food is probably the most common, but some markets also sell clothes, kitchen items, and other everyday products.","ko":"정말 다양한 걸 살 수 있어요. 음식이 가장 흔하지만 어떤 시장에서는 옷, 주방용품, 다른 생활용품도 팔아요."},"7.0":{"en":"It varies depending on the market. Food is usually the main attraction, but you can also find clothes, household goods, and random everyday items that you wouldn't necessarily see in a shopping mall.","ko":"시장마다 달라요. 보통 음식이 가장 큰 비중을 차지하지만, 옷이나 생활용품처럼 쇼핑몰에서는 잘 볼 수 없는 다양한 일상용품도 찾을 수 있어요."}}}]}]},{"id":"paper","topic":{"en":"Paper","ko":"종이"},"status":"approved","questions":[{"id":"paper-q1","question":{"en":"Do you carry paper and pens with you when you go out?","ko":"외출할 때 종이와 펜을 가지고 다니나요?"},"paths":[{"id":"yes","label":{"en":"Yes, usually","ko":"네, 보통"},"answers":{"5.0":{"en":"Yeah, I usually carry a pen and a small notebook. I sometimes need to write something down quickly.","ko":"네, 보통 펜이랑 작은 노트를 가지고 다녀요. 가끔 뭔가를 빨리 적어야 할 때가 있거든요."},"6.0":{"en":"I usually carry a pen and a small notebook in my bag. I don't use them every day, but they're handy when I need to write something down.","ko":"보통 가방에 펜과 작은 노트를 넣어 다녀요. 매일 쓰는 건 아니지만 뭔가 적어야 할 때 유용해요."},"7.0":{"en":"Most of the time, yes. I keep a small notebook and a pen in my bag because sometimes it's quicker to jot something down than take out my phone.","ko":"대부분은 그래요. 휴대폰을 꺼내는 것보다 그냥 빨리 적는 게 더 편할 때가 있어서 가방에 작은 노트와 펜을 넣어 다녀요."}}},{"id":"no","label":{"en":"No, I use my phone","ko":"아니요, 휴대폰 사용"},"answers":{"5.0":{"en":"Not really. I usually use my phone when I need to write something down.","ko":"별로요. 뭔가 적어야 할 때는 보통 휴대폰을 사용해요."},"6.0":{"en":"No, not usually. I use the notes app on my phone for almost everything, so I don't really need to carry paper.","ko":"보통은 안 그래요. 거의 모든 걸 휴대폰 메모 앱에 적기 때문에 굳이 종이를 들고 다닐 필요가 없어요."},"7.0":{"en":"Hardly ever. I used to carry a notebook, but now I just put everything in my phone. It's one less thing to carry around.","ko":"거의 안 들고 다녀요. 예전에는 노트를 가지고 다녔는데 지금은 다 휴대폰에 적어요. 챙길 물건이 하나 줄어든 셈이죠."}}}]},{"id":"paper-q2","question":{"en":"Do people still keep handwritten letters today?","ko":"요즘에도 사람들이 손으로 쓴 편지를 보관하나요?"},"paths":[{"id":"yes_special","label":{"en":"Yes, for special memories","ko":"네, 특별한 추억이라면"},"answers":{"5.0":{"en":"Yes, I think some people do. Letters can be special because they are personal.","ko":"네, 아직도 보관하는 사람이 있다고 생각해요. 편지는 개인적인 느낌이 있어서 특별할 수 있으니까요."},"6.0":{"en":"Yeah, especially if the letter came from someone important. People may keep it because it has a special memory attached to it.","ko":"네, 특히 중요한 사람에게 받은 편지라면요. 특별한 추억이 담겨 있어서 보관하는 경우가 있을 것 같아요."},"7.0":{"en":"I think so, especially when a letter has some sentimental value. A handwritten message feels much more personal than a text, so people are more likely to keep it.","ko":"그럴 것 같아요. 특히 감정적으로 의미가 있는 편지라면 더 그렇죠. 손으로 쓴 메시지는 문자보다 훨씬 개인적인 느낌이 있어서 사람들이 더 오래 간직하는 것 같아요."}}},{"id":"less_common","label":{"en":"Much less common now","ko":"요즘은 훨씬 덜 흔함"},"answers":{"5.0":{"en":"Not as much as before. Most people send messages online now.","ko":"예전만큼은 아닌 것 같아요. 요즘은 대부분 온라인으로 메시지를 보내니까요."},"6.0":{"en":"I think it's much less common now because most communication is digital. People usually send texts or emails instead.","ko":"요즘은 대부분의 소통이 디지털이라 훨씬 덜 흔한 것 같아요. 보통 문자나 이메일을 보내죠."},"7.0":{"en":"Probably not nearly as much as in the past. Most everyday communication has moved online, so handwritten letters are more of a special occasion thing now.","ko":"과거에 비하면 훨씬 덜한 것 같아요. 일상적인 소통은 대부분 온라인으로 옮겨갔기 때문에 손편지는 이제 특별한 날에 쓰는 경우가 더 많은 것 같아요."}}}]},{"id":"paper-q3","question":{"en":"Do you still write physical letters?","ko":"지금도 종이에 직접 편지를 쓰나요?"},"paths":[{"id":"sometimes","label":{"en":"Sometimes, for special occasions","ko":"가끔, 특별한 때"},"answers":{"5.0":{"en":"Sometimes. I write cards or short letters for special occasions.","ko":"가끔요. 특별한 날에는 카드나 짧은 편지를 써요."},"6.0":{"en":"Only occasionally. I might write a short letter or card for a birthday because it feels more personal.","ko":"아주 가끔 써요. 생일 같은 때는 더 개인적인 느낌이 들어서 짧은 편지나 카드를 쓸 수도 있어요."},"7.0":{"en":"Very occasionally, usually for something special like a birthday or a thank-you message. I wouldn't do it for everyday communication, but it feels nicer when the occasion matters.","ko":"아주 가끔, 보통 생일이나 감사 인사처럼 특별한 일이 있을 때 써요. 일상적인 연락에는 쓰지 않지만, 중요한 순간에는 직접 쓰는 게 더 좋은 느낌이 들어요."}}},{"id":"no","label":{"en":"No, almost never","ko":"아니요, 거의 안 함"},"answers":{"5.0":{"en":"No, almost never. I usually send messages on my phone.","ko":"아니요, 거의 안 써요. 보통 휴대폰으로 메시지를 보내요."},"6.0":{"en":"Not really. It's much easier to send a message or an email, so I can't remember the last time I wrote an actual letter.","ko":"별로요. 메시지나 이메일을 보내는 게 훨씬 편해서 마지막으로 실제 편지를 쓴 게 언제인지 기억도 안 나요."},"7.0":{"en":"Honestly, almost never. Digital messages are just so much more convenient that writing a physical letter doesn't really come up in my daily life.","ko":"솔직히 거의 안 써요. 디지털 메시지가 너무 편해서 일상생활에서 굳이 손편지를 쓸 일이 거의 없어요."}}}]},{"id":"paper-q4","question":{"en":"Have you made any crafts with paper?","ko":"종이로 공예품을 만들어 본 적이 있나요?"},"paths":[{"id":"yes_school","label":{"en":"Yes, at school","ko":"네, 학교에서"},"answers":{"5.0":{"en":"Yes, I have. I made simple paper crafts at school when I was young.","ko":"네, 있어요. 어릴 때 학교에서 간단한 종이 공예를 만들었어요."},"6.0":{"en":"Yeah, mostly when I was in school. We made things like paper flowers, cards, and simple decorations.","ko":"네, 주로 학교 다닐 때 했어요. 종이 꽃이나 카드, 간단한 장식 같은 걸 만들었어요."},"7.0":{"en":"Yeah, quite a few when I was younger. Most of them were school projects, like making cards, decorations, or simple models out of paper.","ko":"네, 어릴 때 꽤 여러 가지를 만들었어요. 대부분 학교 과제였고 카드나 장식, 간단한 종이 모형 같은 걸 만들었어요."}}},{"id":"origami","label":{"en":"Yes, origami","ko":"네, 종이접기"},"answers":{"5.0":{"en":"Yes. I used to make simple origami animals when I was a child.","ko":"네. 어릴 때 간단한 종이접기 동물을 만들곤 했어요."},"6.0":{"en":"I used to do a bit of origami when I was younger. I could make a few simple things like cranes and boats.","ko":"어릴 때 종이접기를 조금 했어요. 학이나 배처럼 간단한 건 몇 가지 만들 수 있었어요."},"7.0":{"en":"I did some origami as a kid. I was never especially good at it, but I enjoyed following the steps and seeing a flat piece of paper turn into something.","ko":"어릴 때 종이접기를 좀 했어요. 아주 잘하는 편은 아니었지만 순서를 따라가면서 평평한 종이가 어떤 모양으로 변하는 걸 보는 게 재미있었어요."}}}]},{"id":"paper-q5","question":{"en":"What did you like to do with paper as a child?","ko":"어렸을 때 종이로 무엇을 하는 것을 좋아했나요?"},"paths":[{"id":"drawing","label":{"en":"Drawing","ko":"그림 그리기"},"answers":{"5.0":{"en":"I liked drawing on paper. I used to draw animals and cartoon characters.","ko":"종이에 그림 그리는 걸 좋아했어요. 동물이나 만화 캐릭터를 자주 그렸어요."},"6.0":{"en":"I mostly used paper for drawing. I liked copying cartoon characters and making little pictures when I had free time.","ko":"주로 그림을 그릴 때 종이를 썼어요. 시간이 나면 만화 캐릭터를 따라 그리거나 작은 그림을 그리는 걸 좋아했어요."},"7.0":{"en":"Drawing was probably my favorite thing to do with paper. I'd spend quite a lot of time copying characters I liked or just making up random pictures.","ko":"종이로 하는 것 중에는 그림 그리기를 가장 좋아했던 것 같아요. 좋아하는 캐릭터를 따라 그리거나 그냥 생각나는 대로 그림을 그리면서 꽤 오래 놀곤 했어요."}}},{"id":"crafts","label":{"en":"Making things","ko":"무언가 만들기"},"answers":{"5.0":{"en":"I liked making things with paper, like planes and boats.","ko":"비행기나 배처럼 종이로 뭔가 만드는 걸 좋아했어요."},"6.0":{"en":"I liked folding paper into simple things like planes, boats, and animals. It was an easy way to keep myself busy.","ko":"비행기, 배, 동물처럼 간단한 모양으로 종이를 접는 걸 좋아했어요. 심심할 때 쉽게 할 수 있는 놀이였어요."},"7.0":{"en":"I used to make all sorts of simple things, especially paper planes and little folded shapes. It was one of those activities I could do anywhere without needing much.","ko":"종이비행기나 작은 접기 모양처럼 간단한 것들을 이것저것 만들곤 했어요. 특별한 준비 없이 어디서든 할 수 있는 놀이였죠."}}}]}]},{"id":"fruit-and-vegetables","topic":{"en":"Fruit and vegetables","ko":"과일과 채소"},"status":"approved","questions":[{"id":"fruit-and-vegetables-q1","question":{"en":"Were there any kinds of fruits and vegetables you disliked as a child?","ko":"어렸을 때 싫어했던 과일이나 채소가 있었나요?"},"paths":[{"id":"yes_vegetables","label":{"en":"Yes, some vegetables","ko":"네, 몇몇 채소"},"answers":{"5.0":{"en":"Yes. I didn't like some vegetables when I was a child, especially ones with a strong taste.","ko":"네. 어릴 때는 맛이 강한 채소 몇 가지를 싫어했어요."},"6.0":{"en":"Yeah, I was quite picky about vegetables as a child. I especially disliked anything bitter or with a strong smell.","ko":"네, 어릴 때 채소를 꽤 가려 먹었어요. 특히 쓴맛이 나거나 냄새가 강한 건 싫어했어요."},"7.0":{"en":"Definitely. I was a pretty picky eater when I was young, and anything bitter or strongly flavored was hard for me to eat. I've gotten used to most of it now.","ko":"그럼요. 어릴 때는 꽤 편식하는 편이어서 쓴맛이나 향이 강한 음식은 먹기 힘들었어요. 지금은 대부분 익숙해졌어요."}}},{"id":"not_really","label":{"en":"Not really","ko":"별로 그렇지 않음"},"answers":{"5.0":{"en":"Not really. I ate most fruits and vegetables without a problem.","ko":"별로요. 대부분의 과일과 채소를 문제없이 먹었어요."},"6.0":{"en":"I don't think so. I wasn't a very picky eater, so I was usually fine with most fruits and vegetables.","ko":"그렇지는 않았던 것 같아요. 편식을 심하게 하지 않아서 대부분의 과일과 채소를 잘 먹었어요."},"7.0":{"en":"Not that I can remember. I was actually quite easy to feed as a child, so there weren't many fruits or vegetables that I completely refused to eat.","ko":"기억나는 건 없어요. 어릴 때 먹는 걸 크게 가리지 않는 편이어서 아예 먹기를 거부한 과일이나 채소는 별로 없었던 것 같아요."}}}]},{"id":"fruit-and-vegetables-q2","question":{"en":"What kinds of fruits and vegetables do you dislike?","ko":"어떤 과일이나 채소를 싫어하나요?"},"paths":[{"id":"strong_taste","label":{"en":"Strong or bitter flavors","ko":"강하거나 쓴맛"},"answers":{"5.0":{"en":"I don't really like vegetables with a bitter taste.","ko":"쓴맛이 나는 채소는 별로 안 좋아해요."},"6.0":{"en":"I'm not a big fan of bitter vegetables. I can eat them, but I wouldn't choose them if I had other options.","ko":"쓴 채소를 아주 좋아하는 편은 아니에요. 먹을 수는 있지만 다른 선택지가 있으면 굳이 고르지는 않아요."},"7.0":{"en":"I'm fine with most vegetables, but I still don't really enjoy anything too bitter. I'll eat it if it's part of a dish, but I wouldn't go out of my way to order it.","ko":"대부분의 채소는 괜찮지만 너무 쓴 건 아직도 별로 좋아하지 않아요. 음식에 들어 있으면 먹기는 하지만 일부러 주문할 정도는 아니에요."}}},{"id":"almost_everything","label":{"en":"I like almost everything","ko":"거의 다 좋아함"},"answers":{"5.0":{"en":"I like most fruits and vegetables. There aren't many that I dislike.","ko":"대부분의 과일과 채소를 좋아해요. 싫어하는 건 많지 않아요."},"6.0":{"en":"I'm pretty open to most fruits and vegetables. There are a few I don't love, but nothing I completely avoid.","ko":"대부분의 과일과 채소는 잘 먹어요. 별로 좋아하지 않는 게 몇 개 있긴 하지만 완전히 피하는 건 없어요."},"7.0":{"en":"I'm not very picky these days. There are a couple of things I wouldn't choose on their own, but in general I'll eat pretty much any fruit or vegetable.","ko":"요즘은 거의 가리지 않아요. 따로 먹으라면 굳이 고르지 않을 것들이 몇 가지는 있지만, 전반적으로는 거의 모든 과일과 채소를 먹어요."}}}]},{"id":"fruit-and-vegetables-q3","question":{"en":"Where do you usually buy fruit and vegetables?","ko":"과일과 채소는 보통 어디에서 사나요?"},"paths":[{"id":"supermarket","label":{"en":"Supermarket","ko":"슈퍼마켓"},"answers":{"5.0":{"en":"I usually buy them at a supermarket near my home. It's easy and convenient.","ko":"보통 집 근처 슈퍼마켓에서 사요. 쉽고 편해요."},"6.0":{"en":"Most of the time, I buy them at a supermarket close to home. It's convenient because I can get everything else I need at the same time.","ko":"대부분 집 가까운 슈퍼마켓에서 사요. 다른 장도 한꺼번에 볼 수 있어서 편하거든요."},"7.0":{"en":"Usually at a supermarket near where I live. The main reason is convenience because I can pick up fruit and vegetables while I'm doing the rest of my grocery shopping.","ko":"보통 제가 사는 곳 근처 슈퍼마켓에서 사요. 다른 장을 보는 김에 과일과 채소도 같이 살 수 있어서 편한 게 가장 큰 이유예요."}}},{"id":"market","label":{"en":"Traditional or local market","ko":"전통시장 / 지역 시장"},"answers":{"5.0":{"en":"I sometimes buy them at a local market. The produce is usually fresh.","ko":"가끔 동네 시장에서 사요. 보통 신선한 편이에요."},"6.0":{"en":"I like buying them at a local market when I have time. The produce often looks fresh, and there are usually plenty of choices.","ko":"시간이 있으면 동네 시장에서 사는 걸 좋아해요. 신선해 보이는 경우가 많고 선택지도 많은 편이에요."},"7.0":{"en":"If I have the time, I prefer a local or traditional market. The produce often seems fresher, and I like being able to compare different stalls before I buy anything.","ko":"시간이 있으면 동네 시장이나 전통시장을 더 선호해요. 더 신선해 보이는 경우가 많고, 사기 전에 여러 가게를 비교해볼 수 있는 점도 좋아요."}}}]},{"id":"fruit-and-vegetables-q4","question":{"en":"How often do you eat fruit and vegetables?","ko":"과일과 채소를 얼마나 자주 먹나요?"},"paths":[{"id":"daily","label":{"en":"Every day","ko":"매일"},"answers":{"5.0":{"en":"I eat vegetables every day and fruit quite often.","ko":"채소는 매일 먹고 과일도 꽤 자주 먹어요."},"6.0":{"en":"Pretty much every day. I usually have vegetables with my meals, and I try to eat some fruit as a snack.","ko":"거의 매일 먹어요. 식사할 때 보통 채소를 먹고, 과일은 간식으로 먹으려고 해요."},"7.0":{"en":"Almost every day. Vegetables are part of most of my meals, and I usually have fruit when I want something light between meals.","ko":"거의 매일이에요. 대부분의 식사에 채소가 들어가고, 식사 사이에 가볍게 뭔가 먹고 싶을 때 과일을 먹어요."}}},{"id":"few_times","label":{"en":"A few times a week","ko":"일주일에 몇 번"},"answers":{"5.0":{"en":"A few times a week. I probably should eat more.","ko":"일주일에 몇 번 정도요. 아마 더 먹어야 할 것 같아요."},"6.0":{"en":"Probably a few times a week. I eat vegetables fairly often, but I'm not very consistent when it comes to fruit.","ko":"아마 일주일에 몇 번 정도인 것 같아요. 채소는 꽤 자주 먹지만 과일은 꾸준히 먹는 편은 아니에요."},"7.0":{"en":"A few times a week, I'd say. I'm fairly good with vegetables because they're usually part of a meal, but I tend to forget about fruit unless I buy it in advance.","ko":"일주일에 몇 번 정도라고 할 수 있어요. 채소는 보통 식사에 포함돼 있어서 잘 먹는 편인데, 과일은 미리 사두지 않으면 자꾸 잊어버려요."}}}]}]},{"id":"being-polite","topic":{"en":"Being polite","ko":"예의 바르기"},"status":"approved","questions":[{"id":"being-polite-q1","question":{"en":"Do you think being polite is very important?","ko":"예의 바르게 행동하는 것이 매우 중요하다고 생각하나요?"},"paths":[{"id":"yes","label":{"en":"Yes, very important","ko":"네, 매우 중요함"},"answers":{"5.0":{"en":"Yes, I do. Being polite helps people get along with each other.","ko":"네. 예의 바르게 행동하면 사람들이 서로 잘 지내는 데 도움이 된다고 생각해요."},"6.0":{"en":"Yeah, I think it's really important. Even small things like saying thank you or speaking respectfully can make a big difference.","ko":"네, 정말 중요하다고 생각해요. 감사하다고 말하거나 존중하는 태도로 말하는 작은 행동도 큰 차이를 만들 수 있어요."},"7.0":{"en":"Definitely. You don't have to be overly formal, but basic politeness makes everyday interactions much smoother. It shows that you respect the other person.","ko":"그럼요. 지나치게 격식을 차릴 필요는 없지만 기본적인 예의가 있으면 일상적인 대화가 훨씬 부드러워져요. 상대방을 존중한다는 뜻이기도 하고요."}}},{"id":"depends","label":{"en":"Important, but it depends","ko":"중요하지만 상황에 따라 다름"},"answers":{"5.0":{"en":"Yes, but I think it depends on the situation. You don't always need to be very formal.","ko":"네, 하지만 상황에 따라 다르다고 생각해요. 항상 아주 격식 있게 행동할 필요는 없어요."},"6.0":{"en":"I think it's important, but being polite doesn't always mean being formal. The way I speak to a close friend is obviously different from the way I speak to an older person.","ko":"중요하다고 생각하지만 예의 바르다는 게 항상 격식을 차린다는 뜻은 아니에요. 친한 친구에게 말하는 방식과 나이가 많은 분께 말하는 방식은 당연히 다르죠."},"7.0":{"en":"I think respect is important, but the way you show it depends on the situation. With friends, being too formal can feel strange, while in a professional setting it's much more important to be careful with your words.","ko":"존중하는 태도는 중요하지만 그걸 보여주는 방식은 상황에 따라 달라진다고 생각해요. 친구 사이에서는 너무 격식 차리면 어색할 수 있지만, 직장 같은 곳에서는 말을 더 조심하는 게 중요하죠."}}}]},{"id":"being-polite-q2","question":{"en":"How did you learn to be polite as a child?","ko":"어렸을 때 예의 바르게 행동하는 법을 어떻게 배웠나요?"},"paths":[{"id":"parents","label":{"en":"From my parents","ko":"부모님에게서"},"answers":{"5.0":{"en":"Mostly from my parents. They taught me to say thank you and respect older people.","ko":"주로 부모님께 배웠어요. 감사하다고 말하고 어른을 존중하라고 가르쳐주셨어요."},"6.0":{"en":"I learned most of it from my parents. They always reminded me to greet people properly, say thank you, and be respectful to adults.","ko":"대부분 부모님께 배웠어요. 인사를 제대로 하고 감사하다고 말하고 어른을 존중해야 한다고 늘 알려주셨어요."},"7.0":{"en":"Mostly through my parents. They didn't sit me down and teach me rules, but they constantly reminded me about things like greetings, table manners, and how to speak respectfully to older people.","ko":"주로 부모님을 통해 배웠어요. 따로 앉혀놓고 규칙을 가르치신 건 아니지만, 인사하는 법이나 식사 예절, 어른께 존중하는 말투를 쓰는 것 같은 걸 계속 알려주셨어요."}}},{"id":"school","label":{"en":"At home and school","ko":"가정과 학교에서"},"answers":{"5.0":{"en":"I learned it at home and at school. Adults taught us how to behave around other people.","ko":"집과 학교에서 배웠어요. 어른들이 다른 사람들과 있을 때 어떻게 행동해야 하는지 가르쳐줬어요."},"6.0":{"en":"It was a mix of home and school. My parents taught me basic manners, and teachers also expected us to speak and behave politely.","ko":"집과 학교 둘 다였어요. 부모님은 기본적인 예절을 가르쳐주셨고, 선생님들도 예의 있게 말하고 행동하기를 기대하셨어요."},"7.0":{"en":"I picked it up from both my family and school. At home, I learned basic manners, and at school I learned how to behave in a group and show consideration for other people.","ko":"가족과 학교 모두에서 자연스럽게 배웠어요. 집에서는 기본적인 예절을 배우고, 학교에서는 여러 사람과 함께 있을 때 어떻게 행동하고 배려해야 하는지 배웠어요."}}}]}]},{"id":"tiredness","topic":{"en":"Tiredness","ko":"피로"},"status":"approved","questions":[{"id":"tiredness-q1","question":{"en":"What do you do when you feel tired?","ko":"피곤할 때 무엇을 하나요?"},"paths":[{"id":"rest","label":{"en":"Rest or sleep","ko":"쉬거나 잠자기"},"answers":{"5.0":{"en":"I usually sit down and rest for a while. If I'm very tired, I go to bed early.","ko":"보통 잠깐 앉아서 쉬어요. 많이 피곤하면 일찍 자요."},"6.0":{"en":"I normally take a short break and try to relax. If I'm really exhausted, I just go to bed earlier than usual.","ko":"보통 잠깐 쉬면서 긴장을 풀려고 해요. 정말 지쳤다면 평소보다 일찍 자는 편이에요."},"7.0":{"en":"It depends on how tired I am. If it's just a long day, a short break usually helps, but if I'm completely worn out, I try to get a proper night's sleep instead of pushing myself.","ko":"얼마나 피곤한지에 따라 달라요. 그냥 하루가 길었던 정도라면 잠깐 쉬는 걸로 괜찮지만, 완전히 지쳤다면 억지로 버티기보다 푹 자려고 해요."}}},{"id":"refresh","label":{"en":"Coffee or a short walk","ko":"커피 또는 짧은 산책"},"answers":{"5.0":{"en":"I sometimes have coffee or take a short walk. That helps me feel more awake.","ko":"가끔 커피를 마시거나 짧게 산책해요. 그러면 좀 더 정신이 들어요."},"6.0":{"en":"If I still need to get things done, I'll usually have some coffee or go for a quick walk. That normally wakes me up a bit.","ko":"그래도 해야 할 일이 남아 있으면 보통 커피를 마시거나 잠깐 걸어요. 그러면 조금은 깨어나는 느낌이 들어요."},"7.0":{"en":"If I can't rest right away, I'll usually get some fresh air or have a coffee. A short walk works surprisingly well when I'm tired but still need to stay focused.","ko":"바로 쉴 수 없는 상황이라면 보통 바깥 공기를 쐬거나 커피를 마셔요. 피곤한데도 집중해야 할 때는 짧게 걷는 게 생각보다 효과가 좋아요."}}}]},{"id":"tiredness-q2","question":{"en":"When do you usually feel tired?","ko":"보통 언제 피곤함을 느끼나요?"},"paths":[{"id":"after_work","label":{"en":"After a busy day","ko":"바쁜 하루를 보낸 뒤"},"answers":{"5.0":{"en":"I usually feel tired after a long day at work.","ko":"보통 하루 종일 일하고 나면 피곤해요."},"6.0":{"en":"Mostly at the end of a busy workday. If I've been on my feet for hours, I really feel it when I get home.","ko":"주로 바쁜 근무일이 끝날 때 피곤해요. 몇 시간씩 계속 서 있었다면 집에 도착했을 때 확실히 피로가 느껴져요."},"7.0":{"en":"Usually after a particularly busy day. I can stay focused while I'm working, but once I get home and finally slow down, that's when the tiredness really hits me.","ko":"특히 아주 바쁜 날이 끝난 뒤에 피곤해요. 일하는 동안에는 집중해서 버티는데, 집에 와서 긴장이 풀리면 그때 피로가 확 몰려와요."}}},{"id":"lack_sleep","label":{"en":"When I don't sleep enough","ko":"잠을 충분히 못 잤을 때"},"answers":{"5.0":{"en":"I feel tired when I don't get enough sleep.","ko":"잠을 충분히 못 자면 피곤해요."},"6.0":{"en":"I notice it most when I haven't slept enough the night before. Even one short night can make the whole day feel longer.","ko":"전날 밤에 잠을 충분히 못 잤을 때 가장 크게 느껴요. 하루만 잠을 적게 자도 그날 하루가 훨씬 길게 느껴져요."},"7.0":{"en":"Lack of sleep affects me more than anything else. If I stay up too late, I can usually tell the next morning because it's much harder to concentrate and keep my energy up.","ko":"저한테는 수면 부족이 가장 큰 영향을 줘요. 너무 늦게 자면 다음 날 아침에 바로 티가 나는데, 집중하기도 훨씬 어렵고 에너지를 유지하기도 힘들어요."}}}]},{"id":"tiredness-q3","question":{"en":"Do you often feel tired?","ko":"자주 피곤함을 느끼나요?"},"paths":[{"id":"often","label":{"en":"Quite often","ko":"꽤 자주"},"answers":{"5.0":{"en":"Yeah, quite often. My days can be busy, so I get tired in the evening.","ko":"네, 꽤 자주요. 하루가 바쁜 편이라 저녁이 되면 피곤해져요."},"6.0":{"en":"Pretty often, especially on busy days. I'm usually fine in the morning, but my energy drops later in the day.","ko":"꽤 자주요. 특히 바쁜 날에는 더 그래요. 아침에는 괜찮은데 시간이 지나면서 에너지가 떨어져요."},"7.0":{"en":"Fairly often, especially during busy weeks. It's not that I'm exhausted all the time, but by the end of the day I definitely feel like I need some time to switch off.","ko":"꽤 자주요. 특히 바쁜 주에는 그래요. 늘 완전히 지쳐 있는 건 아니지만, 하루가 끝날 때쯤이면 확실히 아무 생각 없이 쉬고 싶다는 느낌이 들어요."}}},{"id":"not_often","label":{"en":"Not really","ko":"별로 그렇지 않음"},"answers":{"5.0":{"en":"Not really. I usually get enough sleep and feel fine during the day.","ko":"별로요. 보통 잠을 충분히 자서 낮 동안은 괜찮아요."},"6.0":{"en":"Not that often. As long as I sleep well, I usually have enough energy to get through the day.","ko":"그렇게 자주 피곤하지는 않아요. 잠만 잘 자면 보통 하루를 보낼 만큼 충분한 에너지가 있어요."},"7.0":{"en":"Not particularly. I try to keep a fairly regular sleep schedule, so unless I've had an unusually busy day, I don't normally feel exhausted.","ko":"딱히 그렇지는 않아요. 비교적 규칙적으로 자려고 해서, 특별히 바쁜 날이 아니면 보통 완전히 지칠 정도로 피곤하지는 않아요."}}}]}]},{"id":"rubbish-and-recycling","topic":{"en":"Rubbish and recycling","ko":"쓰레기와 재활용"},"status":"approved","questions":[{"id":"rubbish-and-recycling-q1","question":{"en":"How do you recycle things like paper and plastic?","ko":"종이나 플라스틱 같은 물건은 어떻게 재활용하나요?"},"paths":[{"id":"sort_bins","label":{"en":"Sort them into separate bins","ko":"종류별로 분리배출"},"answers":{"5.0":{"en":"I separate paper and plastic and put them in the correct recycling bins.","ko":"종이와 플라스틱을 따로 분리해서 맞는 재활용 수거함에 버려요."},"6.0":{"en":"I sort them by type before I throw them away. Paper, plastic, and cans usually go into separate recycling bins.","ko":"버리기 전에 종류별로 나눠요. 종이, 플라스틱, 캔은 보통 각각 다른 재활용 수거함에 버려요."},"7.0":{"en":"I separate everything by category before taking it out. I usually rinse plastic containers as well, so they're clean before they go into the recycling bin.","ko":"내놓기 전에 종류별로 전부 분리해요. 플라스틱 용기는 재활용함에 넣기 전에 깨끗하게 헹구는 편이에요."}}},{"id":"simple_routine","label":{"en":"Keep recycling separate at home","ko":"집에서 재활용품을 따로 보관"},"answers":{"5.0":{"en":"I keep recyclable things in a separate bag at home and take them out later.","ko":"재활용할 물건은 집에서 따로 봉투에 모아뒀다가 나중에 내놓아요."},"6.0":{"en":"I have a separate area at home for recyclables. I collect paper and plastic there and sort everything properly before taking it out.","ko":"집에 재활용품을 따로 모아두는 공간이 있어요. 종이와 플라스틱을 거기에 모았다가 버리기 전에 제대로 분류해요."},"7.0":{"en":"I keep recyclables separate from normal rubbish from the beginning. That way, when it's time to take everything out, I only need to do a quick final sort.","ko":"처음부터 재활용품을 일반 쓰레기와 따로 모아요. 그러면 버리러 나갈 때 마지막으로 간단하게만 분류하면 돼요."}}}]},{"id":"rubbish-and-recycling-q2","question":{"en":"What do you do when you see rubbish on the street?","ko":"길에서 쓰레기를 보면 어떻게 하나요?"},"paths":[{"id":"pick_up","label":{"en":"Pick it up if possible","ko":"가능하면 주워서 버림"},"answers":{"5.0":{"en":"If there is a bin nearby, I sometimes pick it up and throw it away.","ko":"근처에 쓰레기통이 있으면 가끔 주워서 버려요."},"6.0":{"en":"If it's something small and there's a bin nearby, I'll usually pick it up. I don't like seeing rubbish left on the street.","ko":"작은 쓰레기이고 근처에 쓰레기통이 있으면 보통 주워서 버려요. 길에 쓰레기가 버려져 있는 걸 별로 좋아하지 않아요."},"7.0":{"en":"If it's something I can pick up safely and there's a bin close by, I usually do. It only takes a few seconds, and I'd rather not just walk past it.","ko":"안전하게 주울 수 있는 물건이고 근처에 쓰레기통이 있다면 보통 주워요. 몇 초면 되는 일이라 그냥 지나치는 것보다 낫다고 생각해요."}}},{"id":"depends","label":{"en":"It depends on what it is","ko":"무엇인지에 따라 다름"},"answers":{"5.0":{"en":"It depends. I might pick up paper, but I wouldn't touch something dirty.","ko":"상황에 따라 달라요. 종이 같은 건 주울 수 있지만 더러운 건 만지지 않을 것 같아요."},"6.0":{"en":"It depends on what the rubbish is. If it's clean, like a piece of paper, I might pick it up, but I wouldn't touch anything dirty or unsafe.","ko":"쓰레기가 뭔지에 따라 달라요. 종이처럼 깨끗한 거라면 주울 수도 있지만 더럽거나 위험해 보이는 건 만지지 않을 거예요."},"7.0":{"en":"It really depends on what it is. I'll pick up something harmless like a bottle or a piece of paper, but if it looks dirty or unsafe, I'd leave it alone.","ko":"정말 물건에 따라 달라요. 병이나 종이처럼 위험하지 않은 건 주울 수 있지만, 더럽거나 위험해 보이면 그냥 두는 편이에요."}}}]}]},{"id":"travelling","topic":{"en":"Travelling","ko":"여행"},"status":"approved","questions":[{"id":"travelling-q1","question":{"en":"Do you prefer to sit by the window when travelling?","ko":"여행할 때 창가 자리에 앉는 것을 좋아하나요?"},"paths":[{"id":"window","label":{"en":"Window seat","ko":"창가 자리"},"answers":{"5.0":{"en":"Yes, I do. I like looking outside when I travel.","ko":"네. 여행할 때 밖을 보는 걸 좋아해요."},"6.0":{"en":"Yeah, I usually prefer a window seat. I like watching the scenery, and it gives me something to do during the trip.","ko":"네, 보통 창가 자리를 더 좋아해요. 풍경 보는 걸 좋아하고, 이동하는 동안 할 것도 생기니까요."},"7.0":{"en":"Definitely, especially on longer trips. I enjoy looking out at the scenery, and having the window next to me somehow makes the journey feel less boring.","ko":"그럼요. 특히 장거리 여행일수록 그래요. 밖의 풍경을 보는 걸 좋아하고, 창가에 앉아 있으면 왠지 여행이 덜 지루하게 느껴져요."}}},{"id":"aisle","label":{"en":"Aisle seat","ko":"통로 자리"},"answers":{"5.0":{"en":"Not really. I prefer the aisle because it's easier to get up.","ko":"별로요. 일어나기 더 편해서 통로 쪽 자리를 선호해요."},"6.0":{"en":"I actually prefer the aisle. I like being able to stand up or go to the washroom without asking someone to move.","ko":"저는 오히려 통로 쪽을 더 좋아해요. 다른 사람에게 비켜달라고 하지 않고 일어나거나 화장실에 갈 수 있는 게 좋아요."},"7.0":{"en":"I usually go for the aisle seat, especially on a long trip. I like being able to get up whenever I want, and I don't enjoy feeling stuck by the window.","ko":"특히 장거리에서는 보통 통로 쪽 자리를 선택해요. 원할 때 언제든 일어날 수 있는 게 좋고, 창가에 갇힌 느낌은 별로 안 좋아해요."}}}]},{"id":"travelling-q2","question":{"en":"Did you have a long journey with your family as a child?","ko":"어렸을 때 가족과 장거리 여행을 한 적이 있나요?"},"paths":[{"id":"yes","label":{"en":"Yes","ko":"네"},"answers":{"5.0":{"en":"Yes. I went on a few long trips with my family when I was young.","ko":"네. 어릴 때 가족과 몇 번 긴 여행을 한 적이 있어요."},"6.0":{"en":"Yeah, we took a few long trips when I was a child. I remember spending hours in the car with my family.","ko":"네, 어릴 때 가족과 장거리 여행을 몇 번 했어요. 차 안에서 가족과 몇 시간씩 보냈던 게 기억나요."},"7.0":{"en":"Yeah, a few times. We used to take long car trips during school holidays, and even though the drives felt endless at the time, I have good memories of them now.","ko":"네, 몇 번 있어요. 방학 때 가족과 장거리 자동차 여행을 하곤 했는데, 당시에는 이동 시간이 끝없이 길게 느껴졌지만 지금은 좋은 추억으로 남아 있어요."}}},{"id":"no","label":{"en":"Not really","ko":"별로 그렇지 않음"},"answers":{"5.0":{"en":"Not really. Most of our family trips were quite short.","ko":"별로요. 가족 여행은 대부분 꽤 짧았어요."},"6.0":{"en":"I don't remember any really long journeys. We travelled as a family, but most places we went weren't that far away.","ko":"정말 긴 여행을 했던 기억은 없어요. 가족과 여행은 했지만 대부분 그렇게 멀리 가지는 않았어요."},"7.0":{"en":"Not that I can remember. We did take family trips, but they were usually fairly close to home, so I never had one of those really long journeys as a child.","ko":"기억나는 한은 없어요. 가족 여행은 하긴 했지만 보통 집에서 꽤 가까운 곳으로 갔기 때문에 어릴 때 아주 긴 여행을 해본 적은 없는 것 같아요."}}}]},{"id":"travelling-q3","question":{"en":"What kind of transportation do you usually use when travelling?","ko":"여행할 때 보통 어떤 교통수단을 이용하나요?"},"paths":[{"id":"public_transport","label":{"en":"Train / public transport","ko":"기차 / 대중교통"},"answers":{"5.0":{"en":"I usually take a train or other public transportation. It's convenient.","ko":"보통 기차나 다른 대중교통을 이용해요. 편리하거든요."},"6.0":{"en":"For trips that aren't too far, I usually take a train or public transport. I like not having to worry about driving.","ko":"너무 멀지 않은 여행이라면 보통 기차나 대중교통을 이용해요. 운전 걱정을 안 해도 되는 게 좋아요."},"7.0":{"en":"For shorter trips, I prefer trains or other public transport. I can just sit back and relax instead of dealing with traffic or finding somewhere to park.","ko":"짧은 여행에는 기차나 다른 대중교통을 선호해요. 교통체증이나 주차 걱정 없이 그냥 앉아서 쉴 수 있으니까요."}}},{"id":"car","label":{"en":"Car","ko":"자동차"},"answers":{"5.0":{"en":"I usually travel by car. It's easier when I have a lot of things with me.","ko":"보통 자동차로 여행해요. 짐이 많을 때 더 편해요."},"6.0":{"en":"I usually go by car if the distance isn't too far. It's convenient because I can leave whenever I want and carry more things.","ko":"거리가 너무 멀지 않으면 보통 차로 가요. 원하는 시간에 출발할 수 있고 짐도 더 많이 실을 수 있어서 편해요."},"7.0":{"en":"If it's a domestic trip, I often prefer driving. It gives me more freedom to stop wherever I want, and it's much easier when I'm travelling with luggage.","ko":"국내 여행이라면 운전하는 걸 자주 선호해요. 원하는 곳에서 자유롭게 멈출 수 있고, 짐이 있을 때도 훨씬 편하거든요."}}},{"id":"plane","label":{"en":"Plane for long distances","ko":"장거리는 비행기"},"answers":{"5.0":{"en":"For long trips, I usually take a plane because it's much faster.","ko":"장거리 여행은 보통 비행기를 타요. 훨씬 빠르니까요."},"6.0":{"en":"If I'm travelling a long distance, I normally fly. It saves a lot of time compared with other types of transportation.","ko":"멀리 여행할 때는 보통 비행기를 타요. 다른 교통수단보다 시간을 많이 아낄 수 있어요."},"7.0":{"en":"For long-distance travel, flying is usually the obvious choice for me. Airports can be a bit stressful, but the amount of time it saves makes it worth it.","ko":"장거리 여행에서는 비행기가 보통 가장 자연스러운 선택이에요. 공항이 조금 스트레스일 수는 있지만, 절약되는 시간을 생각하면 그럴 만한 가치가 있어요."}}}]},{"id":"travelling-q4","question":{"en":"Do you think travelling is important for people?","ko":"사람들에게 여행이 중요하다고 생각하나요?"},"paths":[{"id":"yes","label":{"en":"Yes, it broadens your experience","ko":"네, 경험을 넓혀줌"},"answers":{"5.0":{"en":"Yes, I think so. Travelling helps people see new places and learn new things.","ko":"네, 그렇다고 생각해요. 여행을 하면 새로운 곳을 보고 새로운 것을 배울 수 있어요."},"6.0":{"en":"Yeah, I think it can be really valuable. You get to experience different places, food, and ways of living.","ko":"네, 정말 가치 있는 경험이 될 수 있다고 생각해요. 다른 장소와 음식, 생활 방식을 직접 경험할 수 있으니까요."},"7.0":{"en":"I think it can be very valuable because it gets you out of your usual routine. Even a short trip can expose you to different people, food, and ways of doing things.","ko":"아주 가치 있는 경험이 될 수 있다고 생각해요. 평소의 일상에서 벗어날 수 있고, 짧은 여행만으로도 다른 사람들과 음식, 생활 방식을 접할 수 있거든요."}}},{"id":"not_essential","label":{"en":"Useful, but not essential","ko":"유용하지만 필수는 아님"},"answers":{"5.0":{"en":"It can be good, but I don't think everyone needs to travel a lot.","ko":"좋은 경험일 수는 있지만 모든 사람이 여행을 많이 해야 한다고 생각하지는 않아요."},"6.0":{"en":"I think travelling is useful, but I wouldn't say it's necessary for everyone. People can learn a lot in other ways too.","ko":"여행이 도움이 된다고 생각하지만 모두에게 꼭 필요한 건 아니라고 봐요. 다른 방법으로도 많은 걸 배울 수 있으니까요."},"7.0":{"en":"It's definitely a good experience, but I don't think people have to travel constantly to live a meaningful life. It's one way to learn about the world, not the only way.","ko":"분명 좋은 경험이지만 의미 있는 삶을 살기 위해 계속 여행해야 하는 건 아니라고 생각해요. 세상을 배우는 한 가지 방법일 뿐, 유일한 방법은 아니죠."}}}]},{"id":"travelling-q5","question":{"en":"How has travelling changed compared to the past?","ko":"과거와 비교했을 때 여행은 어떻게 달라졌나요?"},"paths":[{"id":"easier","label":{"en":"Much easier now","ko":"지금이 훨씬 쉬움"},"answers":{"5.0":{"en":"I think travelling is easier now. We can book tickets and hotels online.","ko":"요즘은 여행하기가 더 쉬워진 것 같아요. 티켓이나 호텔을 온라인으로 예약할 수 있으니까요."},"6.0":{"en":"It's much easier now because people can book flights, hotels, and transportation online. There's also much more information available.","ko":"요즘은 훨씬 쉬워졌어요. 항공권, 호텔, 교통편을 온라인으로 예약할 수 있고 정보도 훨씬 많아졌어요."},"7.0":{"en":"It's become much easier to organize a trip. You can compare prices, book almost everything online, and check maps or reviews instantly, which takes a lot of uncertainty out of travelling.","ko":"여행 계획을 세우기가 훨씬 쉬워졌어요. 가격을 비교하고 거의 모든 걸 온라인으로 예약할 수 있고, 지도나 리뷰도 바로 확인할 수 있어서 여행할 때 생기는 불확실성이 많이 줄었어요."}}},{"id":"technology","label":{"en":"Technology changed it","ko":"기술이 크게 바꿈"},"answers":{"5.0":{"en":"Technology has changed travelling a lot. People use phones for maps and information.","ko":"기술이 여행을 많이 바꿨어요. 사람들은 지도나 정보를 찾을 때 휴대폰을 사용해요."},"6.0":{"en":"Technology has probably made the biggest difference. We can use our phones for directions, translation, tickets, and finding places to eat.","ko":"아마 기술이 가장 큰 변화를 만든 것 같아요. 휴대폰 하나로 길 찾기, 번역, 티켓 확인, 식당 찾기까지 할 수 있어요."},"7.0":{"en":"Technology has completely changed the way people travel. A phone can now replace a map, guidebook, camera, translator, and even a boarding pass, so travelling feels much more manageable.","ko":"기술이 사람들이 여행하는 방식을 완전히 바꿨어요. 이제 휴대폰 하나가 지도, 가이드북, 카메라, 번역기, 심지어 탑승권까지 대신할 수 있어서 여행이 훨씬 수월해졌어요."}}}]},{"id":"travelling-q6","question":{"en":"What are the benefits of travelling with family?","ko":"가족과 함께 여행하는 것의 장점은 무엇인가요?"},"paths":[{"id":"time_together","label":{"en":"Spend time together","ko":"함께 시간 보내기"},"answers":{"5.0":{"en":"It gives family members more time together. They can relax and enjoy the trip.","ko":"가족이 함께 보낼 시간이 더 많아져요. 같이 쉬면서 여행을 즐길 수 있어요."},"6.0":{"en":"One benefit is that you get proper time together away from work or school. It's easier to talk and enjoy each other's company.","ko":"장점 중 하나는 일이나 학교에서 벗어나 가족과 제대로 함께 시간을 보낼 수 있다는 거예요. 대화도 더 많이 하고 서로의 시간을 즐기기 쉬워요."},"7.0":{"en":"The biggest benefit is probably having uninterrupted time together. Everyone is away from their normal routine, so there's more chance to actually talk and share experiences.","ko":"가장 큰 장점은 방해받지 않고 함께 시간을 보낼 수 있다는 점인 것 같아요. 모두 평소 일상에서 벗어나 있기 때문에 실제로 대화하고 경험을 나눌 기회가 더 많아져요."}}},{"id":"memories","label":{"en":"Create shared memories","ko":"함께 추억 만들기"},"answers":{"5.0":{"en":"Families can make good memories together when they travel.","ko":"가족은 함께 여행하면서 좋은 추억을 만들 수 있어요."},"6.0":{"en":"Travelling together gives families shared memories. Even small things that happen on a trip can become stories people remember for years.","ko":"함께 여행하면 가족끼리 공유할 수 있는 추억이 생겨요. 여행 중에 있었던 사소한 일도 몇 년 동안 기억하는 이야기가 될 수 있어요."},"7.0":{"en":"It gives a family shared experiences that they can look back on later. Sometimes even the things that go wrong on a trip end up becoming the stories everyone remembers.","ko":"나중에 함께 떠올릴 수 있는 공동의 경험이 생겨요. 가끔은 여행 중에 잘못됐던 일조차 결국 모두가 기억하는 재미있는 이야기가 되기도 해요."}}}]}]},{"id":"advertisement","topic":{"en":"Advertisement","ko":"광고"},"status":"approved","questions":[{"id":"advertisement-q1","question":{"en":"Do you often see advertisements when you are on your phone or computer?","ko":"휴대폰이나 컴퓨터를 사용할 때 광고를 자주 보나요?"},"paths":[{"id":"often","label":{"en":"Yes, all the time","ko":"네, 항상"},"answers":{"5.0":{"en":"Yes, all the time. I see ads on websites, videos, and social media.","ko":"네, 항상 봐요. 웹사이트나 영상, 소셜미디어에서 광고를 봐요."},"6.0":{"en":"Yeah, pretty often. They show up on social media, video platforms, and almost every website I visit.","ko":"네, 꽤 자주 봐요. 소셜미디어, 동영상 플랫폼, 그리고 제가 들어가는 거의 모든 웹사이트에서 광고가 나와요."},"7.0":{"en":"Constantly, especially on my phone. Social media and video apps seem to be full of ads, so it's almost impossible to avoid them completely.","ko":"정말 자주 봐요. 특히 휴대폰에서는 더 그래요. 소셜미디어나 영상 앱에 광고가 너무 많아서 완전히 피하기는 거의 불가능한 것 같아요."}}},{"id":"not_much","label":{"en":"Not that much","ko":"그렇게 많지는 않음"},"answers":{"5.0":{"en":"Not too much. I use some apps without advertisements.","ko":"그렇게 많지는 않아요. 광고 없이 쓸 수 있는 앱도 몇 개 사용해요."},"6.0":{"en":"Not as much as before. I pay for a few services without ads, and I don't spend that much time on social media.","ko":"예전보다는 덜 봐요. 광고 없는 유료 서비스를 몇 개 쓰고 있고, 소셜미디어도 그렇게 오래 하지 않거든요."},"7.0":{"en":"Not as much as I used to. I have ad-free subscriptions for some of the services I use most, so I mainly notice ads when I'm browsing regular websites.","ko":"예전만큼 많이 보지는 않아요. 자주 쓰는 서비스 몇 개는 광고 없는 구독을 하고 있어서, 주로 일반 웹사이트를 볼 때 광고가 눈에 들어와요."}}}]},{"id":"advertisement-q2","question":{"en":"What kind of advertising do you like?","ko":"어떤 종류의 광고를 좋아하나요?"},"paths":[{"id":"funny","label":{"en":"Funny or creative ads","ko":"재미있거나 창의적인 광고"},"answers":{"5.0":{"en":"I like funny advertisements. They are more interesting and easier to remember.","ko":"재미있는 광고를 좋아해요. 더 흥미롭고 기억에도 잘 남아요."},"6.0":{"en":"I like ads that are funny or creative. If they tell a short story or make me laugh, I'm more likely to pay attention.","ko":"재미있거나 창의적인 광고를 좋아해요. 짧은 이야기가 있거나 웃기면 더 집중해서 보게 돼요."},"7.0":{"en":"I tend to like ads that are clever or genuinely funny. If an ad can entertain me for a few seconds instead of just pushing a product, I usually remember it.","ko":"재치 있거나 정말 웃긴 광고를 좋아하는 편이에요. 제품만 계속 강조하는 대신 몇 초라도 재미를 주는 광고라면 보통 기억에 남아요."}}},{"id":"useful","label":{"en":"Useful and informative ads","ko":"유용하고 정보가 있는 광고"},"answers":{"5.0":{"en":"I prefer ads that give useful information about the product.","ko":"제품에 대한 유용한 정보를 주는 광고를 선호해요."},"6.0":{"en":"I like simple ads that tell me what the product does and how much it costs. I don't need anything too dramatic.","ko":"제품이 뭔지, 얼마인지 간단하게 알려주는 광고를 좋아해요. 너무 과장된 건 필요 없어요."},"7.0":{"en":"I prefer straightforward ads that actually give me useful information. If I'm interested in a product, I'd rather see the price and main features than a long story.","ko":"실제로 유용한 정보를 주는 직관적인 광고를 선호해요. 제품에 관심이 있다면 긴 이야기보다 가격과 주요 기능을 보는 게 더 좋아요."}}}]},{"id":"advertisement-q3","question":{"en":"Do you like advertisements?","ko":"광고를 좋아하나요?"},"paths":[{"id":"not_really","label":{"en":"Not really","ko":"별로 그렇지 않음"},"answers":{"5.0":{"en":"Not really. I usually find advertisements annoying.","ko":"별로요. 광고는 보통 귀찮다고 느껴요."},"6.0":{"en":"Not particularly. Most of the time they interrupt what I'm watching or reading, so I'd rather not see them.","ko":"딱히 좋아하지 않아요. 대부분 제가 보고 있거나 읽고 있는 걸 방해해서 가능하면 안 보고 싶어요."},"7.0":{"en":"Generally, no. I understand why they're necessary, but when they interrupt a video or cover half a webpage, I find them more annoying than useful.","ko":"대체로 안 좋아해요. 광고가 왜 필요한지는 이해하지만, 영상 중간에 끼어들거나 웹페이지 절반을 가리면 유용하다기보다 짜증난다고 느껴져요."}}},{"id":"sometimes","label":{"en":"Sometimes, if they're relevant","ko":"관련 있으면 가끔"},"answers":{"5.0":{"en":"Sometimes. I don't mind ads if they show me something useful.","ko":"가끔은 괜찮아요. 유용한 걸 보여주는 광고라면 신경 쓰지 않아요."},"6.0":{"en":"It depends. If an ad is relevant to something I'm interested in, I don't mind it, but random ads are usually annoying.","ko":"상황에 따라 달라요. 제가 관심 있는 것과 관련된 광고라면 괜찮지만, 전혀 상관없는 광고는 보통 귀찮아요."},"7.0":{"en":"I don't mind them when they're actually relevant. Occasionally an ad introduces me to something useful, but most of the time I'd still rather see less advertising.","ko":"실제로 저와 관련 있는 광고라면 괜찮아요. 가끔 유용한 제품을 알게 되기도 하지만, 그래도 대부분의 경우 광고는 적게 보는 게 더 좋아요."}}}]},{"id":"advertisement-q4","question":{"en":"Do you see a lot of advertising on trains or other transport?","ko":"기차나 다른 교통수단에서 광고를 많이 보나요?"},"paths":[{"id":"yes","label":{"en":"Yes, quite a lot","ko":"네, 꽤 많음"},"answers":{"5.0":{"en":"Yes, quite a lot. I often see ads inside stations and on trains.","ko":"네, 꽤 많이 봐요. 역 안이나 기차에서 광고를 자주 봐요."},"6.0":{"en":"Yeah, there are usually plenty of ads in stations and on public transport. They're on screens, walls, and sometimes even the doors.","ko":"네, 역이나 대중교통에는 보통 광고가 많아요. 화면, 벽, 때로는 문에도 붙어 있어요."},"7.0":{"en":"Yeah, public transport is full of them, especially in busy stations. You see ads on digital screens, platform walls, and inside the trains themselves.","ko":"네, 대중교통은 광고가 정말 많아요. 특히 붐비는 역에는 디지털 화면, 승강장 벽, 기차 안까지 광고가 있어요."}}},{"id":"dont_notice","label":{"en":"I don't really notice them","ko":"잘 신경 쓰지 않음"},"answers":{"5.0":{"en":"There are some, but I don't really pay attention to them.","ko":"광고가 있긴 하지만 저는 별로 신경 쓰지 않아요."},"6.0":{"en":"I'm sure there are a lot, but I don't really notice them anymore. I usually look at my phone when I'm travelling.","ko":"분명 많이 있을 텐데 이제는 잘 눈에 들어오지 않아요. 이동할 때는 보통 휴대폰을 보거든요."},"7.0":{"en":"There probably are, but I tend to tune them out. When I'm on public transport, I'm usually looking at my phone or thinking about where I need to get off.","ko":"아마 많겠지만 저는 그냥 무시하는 편이에요. 대중교통에서는 보통 휴대폰을 보거나 어디서 내려야 하는지 생각하고 있어요."}}}]},{"id":"advertisement-q5","question":{"en":"Is there an advertisement that made an impression on you when you were a child?","ko":"어렸을 때 인상 깊었던 광고가 있나요?"},"paths":[{"id":"yes","label":{"en":"Yes, a memorable TV ad","ko":"네, 기억나는 TV 광고"},"answers":{"5.0":{"en":"Yes. I remember a funny TV advertisement from when I was young.","ko":"네. 어릴 때 봤던 재미있는 TV 광고가 하나 기억나요."},"6.0":{"en":"Yeah, there were a few TV ads I remember because they had catchy songs. I probably remembered the song more than the product.","ko":"네, 노래가 귀에 잘 들어와서 기억나는 TV 광고가 몇 개 있어요. 아마 제품보다 노래를 더 잘 기억하는 것 같아요."},"7.0":{"en":"Yeah, I remember a few TV commercials with really catchy jingles. It's funny because I don't remember much about the actual products, but I can still remember parts of the songs.","ko":"네, 정말 귀에 잘 붙는 징글이 나왔던 TV 광고 몇 개가 기억나요. 재미있는 건 제품 자체는 거의 기억이 안 나는데 노래 일부는 아직도 기억난다는 거예요."}}},{"id":"no","label":{"en":"No, not really","ko":"아니요, 별로"},"answers":{"5.0":{"en":"Not really. I saw many ads, but I don't remember one clearly.","ko":"별로요. 광고를 많이 봤지만 하나가 특별히 또렷하게 기억나지는 않아요."},"6.0":{"en":"I can't think of a specific one. I'm sure I saw a lot of TV ads as a child, but none of them really stayed with me.","ko":"특정한 광고는 잘 떠오르지 않아요. 어릴 때 TV 광고를 많이 봤겠지만 특별히 오래 기억에 남은 건 없는 것 같아요."},"7.0":{"en":"Nothing specific comes to mind. I probably saw hundreds of commercials growing up, but I can't say that any particular one made a lasting impression on me.","ko":"특별히 떠오르는 건 없어요. 자라면서 수백 개의 광고를 봤겠지만, 그중 하나가 오래 기억에 남을 정도로 인상적이었다고 말하기는 어려워요."}}}]}]},{"id":"shoes","topic":{"en":"Shoes","ko":"신발"},"status":"approved","questions":[{"id":"shoes-q1","question":{"en":"Which do you prefer, fashionable shoes or comfortable shoes?","ko":"유행하는 신발과 편안한 신발 중 어느 쪽을 더 좋아하나요?"},"paths":[{"id":"comfortable","label":{"en":"Comfortable shoes","ko":"편안한 신발"},"answers":{"5.0":{"en":"I prefer comfortable shoes. I wear them for many hours, so comfort is important.","ko":"편한 신발을 더 좋아해요. 여러 시간 신는 경우가 많아서 편안함이 중요해요."},"6.0":{"en":"Definitely comfortable shoes. I spend a lot of time on my feet, so I care much more about how they feel than how fashionable they look.","ko":"확실히 편한 신발이요. 오래 서 있는 시간이 많아서 얼마나 유행하는지보다 신었을 때 얼마나 편한지가 훨씬 중요해요."},"7.0":{"en":"Comfort comes first for me. If I'm going to wear shoes for hours, I need to be able to walk around without thinking about my feet the whole time.","ko":"저한테는 편안함이 가장 중요해요. 몇 시간씩 신어야 한다면 계속 발이 신경 쓰이지 않고 편하게 걸어 다닐 수 있어야 해요."}}},{"id":"both","label":{"en":"A balance of both","ko":"둘 다 균형 있게"},"answers":{"5.0":{"en":"I like shoes that are both comfortable and nice-looking.","ko":"편하면서 보기에도 좋은 신발을 좋아해요."},"6.0":{"en":"Ideally, I want both. I wouldn't buy uncomfortable shoes just because they look good, but I still want something that suits my style.","ko":"가능하면 둘 다 갖춘 신발이 좋아요. 예쁘다는 이유만으로 불편한 신발을 사지는 않겠지만, 그래도 제 스타일에 맞는 걸 원해요."},"7.0":{"en":"I try to find a balance. Comfort matters more, but if two pairs feel equally good, I'll obviously choose the one I think looks better.","ko":"두 가지를 적당히 맞추려고 해요. 편안함이 더 중요하지만, 두 켤레가 똑같이 편하다면 당연히 더 예뻐 보이는 걸 고를 거예요."}}}]},{"id":"shoes-q2","question":{"en":"How much money do you usually spend on shoes?","ko":"신발에 보통 얼마 정도를 쓰나요?"},"paths":[{"id":"moderate","label":{"en":"A reasonable amount","ko":"적당한 금액"},"answers":{"5.0":{"en":"I usually spend a reasonable amount. I don't buy very expensive shoes.","ko":"보통 적당한 금액을 써요. 아주 비싼 신발은 사지 않아요."},"6.0":{"en":"I normally stay somewhere in the middle. I don't need luxury shoes, but I also don't want the cheapest pair if the quality is poor.","ko":"보통 중간 정도 가격대를 고르는 편이에요. 명품 신발은 필요 없지만, 품질이 안 좋은 가장 싼 제품을 사고 싶지도 않아요."},"7.0":{"en":"I usually spend enough to get something comfortable and durable, but I don't care about expensive brands. I'd rather pay for quality than for a logo.","ko":"편하고 오래 신을 수 있는 정도에는 돈을 쓰지만 비싼 브랜드 자체에는 관심이 없어요. 로고보다 품질에 돈을 쓰는 게 더 좋아요."}}},{"id":"more_for_quality","label":{"en":"More for a good pair","ko":"좋은 신발에는 더 쓰는 편"},"answers":{"5.0":{"en":"I can spend more if the shoes are good quality and last a long time.","ko":"품질이 좋고 오래 신을 수 있다면 돈을 더 쓸 수 있어요."},"6.0":{"en":"I'm willing to spend a bit more on a good pair, especially if I know I'll wear them often. Cheap shoes aren't always worth it.","ko":"좋은 신발이라면 조금 더 돈을 쓸 의향이 있어요. 특히 자주 신을 걸 안다면 더 그래요. 싼 신발이 항상 더 이득인 건 아니니까요."},"7.0":{"en":"I don't mind paying more if they're shoes I'll use all the time. A well-made pair that lasts for years can actually be better value than replacing cheap ones every few months.","ko":"계속 신을 신발이라면 돈을 더 써도 괜찮아요. 몇 년 동안 신을 수 있는 잘 만든 신발 한 켤레가 몇 달마다 싼 신발을 바꾸는 것보다 오히려 더 경제적일 수 있어요."}}}]},{"id":"shoes-q3","question":{"en":"Have you ever bought shoes online?","ko":"온라인으로 신발을 사 본 적이 있나요?"},"paths":[{"id":"yes","label":{"en":"Yes","ko":"네"},"answers":{"5.0":{"en":"Yes, I have. It's convenient, but I always check the size carefully.","ko":"네, 있어요. 편리하지만 사이즈는 항상 꼼꼼하게 확인해요."},"6.0":{"en":"Yeah, I've bought shoes online a few times. It's convenient, especially when I already know the brand and my size.","ko":"네, 온라인으로 신발을 몇 번 사봤어요. 특히 이미 아는 브랜드이고 제 사이즈를 알고 있을 때 편해요."},"7.0":{"en":"Yeah, several times. I usually only do i
