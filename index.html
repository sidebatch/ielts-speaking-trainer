<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f2">
  <title>IELTS Speaking Trainer</title>
  <link rel="stylesheet" href="./styles.css?v=20260918-qa1">
</head>
<body>
  <div id="app">
    <div style="padding:24px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#6b716b">
      앱을 불러오는 중...
    </div>
  </div>

  <script>
    window.addEventListener('error', function (event) {
      var root = document.getElementById('app');
      if (!root) return;
      if (root.textContent && !root.textContent.includes('앱을 불러오는 중')) return;
      root.innerHTML =
        '<div style="padding:24px;font-family:system-ui,-apple-system,Segoe UI,sans-serif">' +
        '<h2 style="margin:0 0 8px">앱을 불러오지 못했어요.</h2>' +
        '<p style="color:#6b716b;line-height:1.5">페이지를 새로고침해 주세요. 계속 문제가 생기면 오류 화면을 캡처해 주세요.</p>' +
        '</div>';
    });
  </script>
  <script src="./data/content.js?v=20260918-qa1"></script>
  <script src="./app.js?v=20260918-qa1"></script>
</body>
</html>
