t with brands I've worn before because shoe sizes can vary, and returning the wrong size is a hassle.","ko":"네, 여러 번 있어요. 신발은 브랜드마다 사이즈가 다를 수 있고 잘못 산 걸 반품하는 것도 번거로워서, 보통 전에 신어본 브랜드만 온라인으로 사요."}}},{"id":"prefer_store","label":{"en":"No, I prefer trying them on","ko":"아니요, 직접 신어보는 편"},"answers":{"5.0":{"en":"Not really. I prefer trying shoes on before I buy them.","ko":"별로요. 사기 전에 직접 신어보는 걸 더 좋아해요."},"6.0":{"en":"I usually avoid buying shoes online because I want to try them on first. The same size can feel different depending on the shoe.","ko":"온라인으로 신발 사는 건 보통 피하는 편이에요. 먼저 신어보고 싶거든요. 같은 사이즈라도 신발에 따라 느낌이 다를 수 있어요."},"7.0":{"en":"I generally prefer buying them in person. Fit matters a lot to me, and even if I know my size, different styles can feel completely different once I put them on.","ko":"대체로 직접 가서 사는 걸 더 선호해요. 저한테는 착화감이 중요해서 사이즈를 알고 있어도 디자인에 따라 신었을 때 느낌이 완전히 다를 수 있어요."}}}]},{"id":"shoes-q4","question":{"en":"Do you like buying shoes? How often?","ko":"신발 사는 것을 좋아하나요? 얼마나 자주 사나요?"},"paths":[{"id":"yes_occasional","label":{"en":"Yes, occasionally","ko":"네, 가끔"},"answers":{"5.0":{"en":"Yeah, I like it, but I don't buy shoes very often. Maybe a few times a year.","ko":"네, 좋아하지만 자주 사는 편은 아니에요. 아마 일 년에 몇 번 정도예요."},"6.0":{"en":"I enjoy buying shoes, but it's not something I do all the time. I probably get a new pair a few times a year.","ko":"신발 사는 걸 좋아하긴 하지만 항상 하는 건 아니에요. 아마 일 년에 몇 번 새 신발을 사는 것 같아요."},"7.0":{"en":"I do enjoy it, especially when I find a pair that looks good and feels comfortable. Still, I only buy shoes a few times a year because I don't need a huge collection.","ko":"좋아해요. 특히 보기에도 좋고 편한 신발을 찾으면 기분이 좋아요. 그래도 신발을 아주 많이 가질 필요는 없어서 일 년에 몇 번 정도만 사요."}}},{"id":"only_when_needed","label":{"en":"Only when I need them","ko":"필요할 때만"},"answers":{"5.0":{"en":"Not really. I usually buy shoes only when my old ones need replacing.","ko":"별로요. 보통 기존 신발을 바꿔야 할 때만 새 신발을 사요."},"6.0":{"en":"I'm not that interested in shopping for shoes. I normally buy a new pair only when I actually need one.","ko":"신발 쇼핑 자체에는 크게 관심이 없어요. 실제로 필요할 때만 새 신발을 사는 편이에요."},"7.0":{"en":"Not particularly. I treat shoes as something practical, so I usually replace them when they're worn out rather than buying new pairs just because I see something I like.","ko":"딱히 좋아하지 않아요. 신발은 실용적인 물건이라고 생각해서 마음에 드는 걸 봤다고 새로 사기보다는 기존 신발이 닳았을 때 교체하는 편이에요."}}}]}]},{"id":"feeling-bored","topic":{"en":"Feeling bored","ko":"지루함"},"status":"approved","questions":[{"id":"feeling-bored-q1","question":{"en":"Do you think childhood is boring or adulthood is boring?","ko":"어린 시절과 성인 생활 중 어느 쪽이 더 지루하다고 생각하나요?"},"paths":[{"id":"childhood","label":{"en":"Childhood can be more boring","ko":"어린 시절이 더 지루할 수 있음"},"answers":{"5.0":{"en":"I think childhood can be more boring because children have less freedom.","ko":"아이들이 자유가 적기 때문에 어린 시절이 더 지루할 수도 있다고 생각해요."},"6.0":{"en":"Maybe childhood. Kids have more free time, but they don't always get to choose what they do or where they go.","ko":"아마 어린 시절인 것 같아요. 아이들은 자유 시간이 더 많지만 무엇을 할지, 어디에 갈지를 항상 스스로 정할 수 있는 건 아니니까요."},"7.0":{"en":"I'd probably say childhood, mainly because children have less control over their time. You might have lots of free time, but you still depend on adults for most things.","ko":"아마 어린 시절이라고 할 것 같아요. 아이들은 자기 시간을 스스로 결정할 수 있는 범위가 더 적으니까요. 자유 시간이 많아도 대부분의 일에서 여전히 어른에게 의존해야 해요."}}},{"id":"adulthood","label":{"en":"Adulthood can be more boring","ko":"성인 생활이 더 지루할 수 있음"},"answers":{"5.0":{"en":"I think adulthood can be more boring because life can become repetitive.","ko":"성인이 된 뒤가 더 지루할 수도 있다고 생각해요. 생활이 반복적으로 변할 수 있으니까요."},"6.0":{"en":"Probably adulthood. Work and daily responsibilities can make every day feel quite similar if you're not careful.","ko":"아마 성인 생활인 것 같아요. 일과 일상적인 책임 때문에 조심하지 않으면 매일이 비슷하게 느껴질 수 있어요."},"7.0":{"en":"Adulthood can definitely feel more repetitive. Once work and responsibilities take up most of your time, it's easy to fall into the same routine every day.","ko":"성인 생활은 확실히 더 반복적으로 느껴질 수 있어요. 일과 책임이 대부분의 시간을 차지하기 시작하면 매일 같은 일상에 빠지기 쉽거든요."}}},{"id":"depends","label":{"en":"It depends on the person","ko":"사람에 따라 다름"},"answers":{"5.0":{"en":"I think it depends. Both children and adults can feel bored sometimes.","ko":"상황에 따라 다르다고 생각해요. 아이도 어른도 가끔 지루할 수 있어요."},"6.0":{"en":"It really depends on the person. Some children are always busy, and some adults have very interesting lives, so I don't think age decides it.","ko":"정말 사람에 따라 달라요. 늘 바쁜 아이도 있고 아주 흥미로운 삶을 사는 어른도 있어서 나이가 지루함을 결정한다고 생각하지 않아요."},"7.0":{"en":"I don't think one is automatically more boring than the other. It probably has more to do with someone's personality and how they spend their time than their age.","ko":"둘 중 하나가 무조건 더 지루하다고 생각하지 않아요. 나이보다는 그 사람의 성격과 시간을 어떻게 보내는지가 더 큰 영향을 주는 것 같아요."}}}]},{"id":"feeling-bored-q2","question":{"en":"What do you do when you feel bored?","ko":"지루할 때 무엇을 하나요?"},"paths":[{"id":"phone_media","label":{"en":"Watch or read something","ko":"영상 보거나 읽기"},"answers":{"5.0":{"en":"I usually watch videos or look at my phone when I'm bored.","ko":"심심할 때는 보통 영상을 보거나 휴대폰을 봐요."},"6.0":{"en":"I normally watch something, read, or just look through things on my phone. It depends on how much free time I have.","ko":"보통 뭔가를 보거나 책을 읽거나 휴대폰으로 이것저것 봐요. 자유 시간이 얼마나 있는지에 따라 달라요."},"7.0":{"en":"If I'm just a little bored, I'll usually watch something short or read for a while. I try not to scroll on my phone for too long because that can make me feel even more bored.","ko":"조금 심심한 정도라면 짧은 영상을 보거나 잠깐 책을 읽어요. 휴대폰을 너무 오래 넘겨보면 오히려 더 지루해질 수 있어서 그러지 않으려고 해요."}}},{"id":"go_out","label":{"en":"Go out or exercise","ko":"밖에 나가거나 운동하기"},"answers":{"5.0":{"en":"I like going for a walk or doing some exercise. It helps me feel better.","ko":"산책하거나 운동하는 걸 좋아해요. 그러면 기분이 좀 나아져요."},"6.0":{"en":"If I have enough time, I prefer going outside or doing some exercise. It changes my mood much faster than sitting at home.","ko":"시간이 충분하면 밖에 나가거나 운동하는 걸 더 좋아해요. 집에 가만히 있는 것보다 기분 전환이 훨씬 빨리 돼요."},"7.0":{"en":"I usually try to get out of the house. Even a short walk or workout helps because once I start moving, I stop thinking about being bored.","ko":"보통 집 밖으로 나가려고 해요. 짧은 산책이나 운동만 해도 도움이 되는데, 몸을 움직이기 시작하면 심심하다는 생각을 덜 하게 되거든요."}}}]},{"id":"feeling-bored-q3","question":{"en":"When would you feel bored?","ko":"어떤 때 지루함을 느끼나요?"},"paths":[{"id":"waiting","label":{"en":"When I'm waiting","ko":"기다릴 때"},"answers":{"5.0":{"en":"I get bored when I have to wait for a long time and have nothing to do.","ko":"오랫동안 기다려야 하는데 할 게 없으면 지루해져요."},"6.0":{"en":"I usually get bored when I'm waiting somewhere with nothing to do, especially if I don't know how long the wait will be.","ko":"할 일 없이 어딘가에서 기다릴 때 보통 지루해져요. 특히 얼마나 오래 기다려야 하는지 모르면 더 그래요."},"7.0":{"en":"Long waits are probably when I get bored most easily. If I know I'll be waiting for half an hour, I can prepare something to do, but unexpected waiting is much worse.","ko":"긴 대기 시간이 제가 가장 쉽게 지루해지는 상황인 것 같아요. 30분 기다릴 걸 미리 알면 할 일을 준비할 수 있지만, 예상하지 못한 기다림은 훨씬 더 힘들어요."}}},{"id":"repetitive","label":{"en":"When something is repetitive","ko":"반복적인 일을 할 때"},"answers":{"5.0":{"en":"I feel bored when I do the same thing for too long.","ko":"같은 일을 너무 오래 하면 지루해져요."},"6.0":{"en":"I get bored when a task is very repetitive and I have to do it for a long time without much change.","ko":"일이 아주 반복적이고 변화 없이 오랫동안 해야 하면 지루해져요."},"7.0":{"en":"Repetitive tasks get to me more than having nothing to do. If I'm doing the same simple thing over and over, my attention starts drifting pretty quickly.","ko":"저한테는 아무것도 안 하는 것보다 반복적인 일이 더 힘들어요. 같은 단순한 일을 계속 반복하면 금방 집중력이 흐트러져요."}}}]},{"id":"feeling-bored-q4","question":{"en":"Do you often feel bored?","ko":"자주 지루함을 느끼나요?"},"paths":[{"id":"rarely","label":{"en":"Not very often","ko":"자주는 아님"},"answers":{"5.0":{"en":"Not very often. I usually have something to do.","ko":"그렇게 자주는 아니에요. 보통 할 일이 있어요."},"6.0":{"en":"Not really. My days are usually quite busy, so I don't have much time to sit around feeling bored.","ko":"별로요. 보통 하루가 꽤 바빠서 가만히 앉아서 심심해할 시간이 많지 않아요."},"7.0":{"en":"Not that often, mainly because I usually have something I want or need to do. If I do get free time, I can normally find a way to use it.","ko":"그렇게 자주는 아니에요. 보통 하고 싶거나 해야 할 일이 있기 때문이에요. 자유 시간이 생겨도 대체로 뭔가 할 일을 찾을 수 있어요."}}},{"id":"sometimes","label":{"en":"Sometimes","ko":"가끔"},"answers":{"5.0":{"en":"Sometimes, especially when I have free time and no plans.","ko":"가끔요. 특히 자유 시간은 있는데 아무 계획도 없을 때요."},"6.0":{"en":"Sometimes, usually on days when I don't have any plans. After a while, I start looking for something to do.","ko":"가끔 그래요. 보통 아무 계획이 없는 날에 그래요. 시간이 좀 지나면 뭘 할지 찾기 시작해요."},"7.0":{"en":"Every now and then, especially when I suddenly have a lot of free time with nothing planned. I'm so used to being busy that too much empty time can actually feel strange.","ko":"가끔 그래요. 특히 갑자기 계획 없는 자유 시간이 많이 생길 때요. 늘 바쁘게 지내는 데 익숙해서 오히려 시간이 너무 많이 비면 좀 이상하게 느껴질 때도 있어요."}}}]}]}]};

  <script>const SKEY='ielts-speaking-trainer-v2';
const levels=['5.0','6.0','7.0'];
const accents=[
 {id:'en-US',flag:'🇺🇸',name:'미국',short:'US'},
 {id:'en-GB',flag:'🇬🇧',name:'영국',short:'UK'},
 {id:'en-CA',flag:'🇨🇦',name:'캐나다',short:'CA'},
 {id:'en-AU',flag:'🇦🇺',name:'호주',short:'AU'}
];
let state=load(), view='home', topicId=null, session=null, path=null, level=state.target, qko=false, ako=false, trainer=null, flipSide='front';
const flat=DATA.topics.flatMap(t=>t.questions.map(q=>({...q,topic:t})));
const qmap=new Map(flat.map(q=>[q.id,q]));
const app=document.getElementById('app');
function defaults(){return{target:'6.0',review:{},history:{},accent:'en-US',voiceURI:''}}
function load(){try{return Object.assign(defaults(),JSON.parse(localStorage.getItem(SKEY)||'{}'))}catch{return defaults()}}
function save(){localStorage.setItem(SKEY,JSON.stringify(state))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function day(){return new Date().toISOString().slice(0,10)}
function toast(s){const e=document.createElement('div');e.className='toast';e.textContent=s;document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}
function voices(){return ('speechSynthesis' in window?speechSynthesis.getVoices():[]).filter(v=>/^en([-_]|$)/i.test(v.lang||''))}
function matchingVoices(){const wanted=(state.accent||'en-US').toLowerCase();return voices().filter(v=>(v.lang||'').toLowerCase()===wanted)}
function chosenVoice(){
 const all=voices();
 if(state.voiceURI){const exact=all.find(v=>v.voiceURI===state.voiceURI);if(exact)return exact}
 return matchingVoices()[0]||null
}
function speak(s,rate=.92){
 if(!('speechSynthesis' in window)){toast('이 브라우저는 음성 재생을 지원하지 않아요.');return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(s);
 u.lang=state.accent||'en-US';
 u.rate=rate;
 const v=chosenVoice();
 if(v){u.voice=v;u.lang=v.lang||u.lang}
 speechSynthesis.speak(u)
}
const APP_VERSION='v0.5.1';
function nav(active){return '<nav class="bottom">'+[['home','🏠','홈'],['topics','📚','토픽'],['review','🔁','복습'],['history','📅','기록'],['settings','⚙️','설정']].map(x=>'<button class="nav '+(active===x[0]?'on':'')+'" data-nav="'+x[0]+'"><strong>'+x[1]+'</strong>'+x[2]+'</button>').join('')+'</nav>'}
function shell(body,active='home'){app.innerHTML='<header class="top"><div class="topin"><div class="brand"><b>IELTS Speaking Trainer</b><span>2026 Sep–Dec · Part 1</span></div><span class="versionBadge">'+APP_VERSION+'</span></div></header><main>'+body+'</main>'+nav(active)}
function home(){
 const today=state.history[day()]||{studied:0,success:0,retry:0};
 shell('<section class="hero"><div class="eyebrow">PART 1 SPEAKING</div><h1>좋은 답변을 반복해서<br>말의 뼈대를 만들어요.</h1><p>질문을 듣고, 나와 가까운 답변 방향을 고른 뒤 읽기·듣기·타이핑으로 익혀보세요.</p><div class="levels">'+levels.map(l=>'<button class="level '+(state.target===l?'on':'')+'" data-target="'+l+'">Target '+l+'</button>').join('')+'</div><div class="stats"><div class="stat"><b>'+today.studied+'</b><span>오늘 학습</span></div><div class="stat"><b>'+today.success+'</b><span>성공</span></div><div class="stat"><b>'+Object.keys(state.review).length+'</b><span>복습 저장</span></div></div></section><div class="grid"><button class="quick" data-today><i>▶️</i><b>오늘 학습</b><span>시즌 문제 중 최대 5문항</span></button><button class="quick" data-nav="topics"><i>📚</i><b>토픽별 학습</b><span>'+DATA.topics.length+'개 토픽 · '+flat.length+'문항</span></button><button class="quick" data-nav="review"><i>🔁</i><b>맞춤 복습</b><span>다시 연습한 답변부터</span></button><button class="quick" data-nav="history"><i>📅</i><b>학습 기록</b><span>최근 학습량 확인</span></button></div>','home')
}
function topics(){
 shell('<div class="secHead"><h2>토픽</h2><span>'+DATA.topics.length+' topics</span></div><div class="list">'+DATA.topics.map(t=>'<button class="row" data-topic="'+t.id+'"><span><b>'+esc(t.topic.en)+'</b><small>'+esc(t.topic.ko)+'</small></span><small>'+t.questions.length+' questions ›</small></button>').join('')+'</div>','topics')
}
function topic(){
 const t=DATA.topics.find(x=>x.id===topicId); if(!t)return topics();
 shell('<div class="pageTitle"><button class="back" data-nav="topics">←</button><div><h1>'+esc(t.topic.en)+'</h1><p>'+esc(t.topic.ko)+' · '+t.questions.length+' questions</p></div></div><div class="list">'+t.questions.map((q,i)=>'<button class="row" data-q="'+q.id+'"><span><b>'+(i+1)+'. '+esc(q.question.en)+'</b><small>'+esc(q.question.ko)+'</small></span><span>›</span></button>').join('')+'</div>','topics')
}
function review(){
 const arr=Object.entries(state.review);
 shell('<div class="secHead"><h2>맞춤 복습</h2><span>'+arr.length+' saved</span></div>'+(arr.length?'<div class="list">'+arr.map(([k,v])=>{const [qid,pid]=k.split('::'),q=qmap.get(qid),p=q?.paths.find(x=>x.id===pid);return q&&p?'<div class="reviewItem"><button class="row" data-review="'+k+'"><span><b>'+esc(q.question.en)+'</b><small>'+esc(p.label.ko)+' · '+(v.status==='retry'?'다시 연습':'성공')+'</small></span><span>›</span></button><button class="reviewRemove" data-remove-review="'+k+'" aria-label="복습에서 제거">제거</button></div>':''}).join('')+'</div>':'<div class="empty">아직 복습할 답변이 없어요.<br>학습 후 <b>다시 연습</b>을 눌러보세요.</div>'),'review')
}
function historyView(){
 const days=Object.keys(state.history).sort().reverse().slice(0,14);
 shell('<div class="secHead"><h2>학습 기록</h2><span>최근 14일</span></div>'+(days.length?'<div class="list">'+days.map(d=>{const h=state.history[d];return '<div class="row"><span><b>'+d+'</b><small>학습 '+h.studied+' · 성공 '+h.success+' · 다시 '+h.retry+'</small></span></div>'}).join('')+'</div>':'<div class="empty">아직 학습 기록이 없어요.</div>'),'history')
}
function settings(){
 const mv=matchingVoices();
 const voiceOptions='<option value="">자동 선택</option>'+mv.map(v=>'<option value="'+esc(v.voiceURI)+'" '+(state.voiceURI===v.voiceURI?'selected':'')+'>'+esc(v.name)+' ('+esc(v.lang)+')</option>').join('');
 const voiceStatus=mv.length?mv.length+'개 음성 사용 가능':'이 기기에서 해당 지역 음성을 찾지 못했어요';
 shell(
  '<div class="pageTitle"><div><h1>설정</h1><p>학습 레벨과 영어 발음을 설정해요.</p></div></div>'+
  '<section class="card settingCard"><div class="settingTitle"><b>목표 답변 레벨</b><span>학습할 기본 답변 난이도</span></div><div class="levels">'+levels.map(l=>'<button class="level '+(state.target===l?'on':'')+'" data-target="'+l+'">Target '+l+'</button>').join('')+'</div><p class="settingNote">이 레벨은 학습용 답변 난이도예요. 같은 문장을 말한다고 실제 시험 점수가 보장되는 것은 아니에요.</p></section>'+
  '<section class="card settingCard"><div class="settingTitle"><b>영어 발음</b><span>질문·답변·문장 학습의 TTS에 적용</span></div>'+
   '<div class="accentGrid">'+accents.map(a=>'<button class="accent '+(state.accent===a.id?'on':'')+'" data-accent="'+a.id+'"><strong>'+a.flag+'</strong><b>'+a.name+'</b><small>'+a.short+'</small></button>').join('')+'</div>'+
   '<label class="voiceLabel" for="voiceSelect">기기 음성</label><select class="voiceSelect" id="voiceSelect">'+voiceOptions+'</select>'+
   '<div class="voiceMeta">'+esc(voiceStatus)+'</div>'+
   '<button class="big secondary previewVoice" data-preview-voice>🔊 선택한 발음 미리 듣기</button>'+
   '<p class="settingNote">브라우저와 기기에 설치된 음성에 따라 실제 음색은 달라질 수 있어요. 해당 지역 음성이 없으면 브라우저가 가장 가까운 영어 음성을 사용합니다.</p>'+
  '</section>',
  'settings'
 )
}
function start(ids,origin='topics',reviewKey=null){session={ids,index:0,origin,reviewKey};path=null;level=state.target;qko=false;ako=false;trainer=null;flipSide='front';view='study';study()}
function cur(){return qmap.get(session.ids[session.index])}
function study(){
 const q=cur(); if(!q){view='home';return home()}
 if(session.reviewKey&&!path){const pid=session.reviewKey.split('::')[1];path=q.paths.find(p=>p.id===pid)||null}
 const pct=Math.round((session.index/session.ids.length)*100);
 let content='';
 if(!path){
  content='<section class="card qcard"><span class="chip">'+esc(q.topic.topic.en)+' · '+esc(q.topic.topic.ko)+'</span><p class="qen">'+esc(q.question.en)+'</p>'+(qko?'<p class="qko">'+esc(q.question.ko)+'</p>':'')+'<div class="tools"><button class="tool" data-speak-q>🔊 질문 듣기</button><button class="tool" data-qko>'+(qko?'뜻 숨기기':'뜻 보기')+'</button></div></section><section class="section"><div class="secHead"><h2>답변 방향</h2><span>나와 가까운 것을 선택</span></div><div class="paths">'+q.paths.map(p=>'<button class="path" data-path="'+p.id+'"><b>'+esc(p.label.en)+'</b><small>'+esc(p.label.ko)+'</small></button>').join('')+'</div></section>';
 }else{
  const a=path.answers[level];
  content='<div class="flipWrap"><div class="flipCard '+(flipSide==='back'?'flipped':'')+'"><div class="flipInner">'+
   '<section class="flipFace flipFront"><div class="flipTop"><span class="flipKicker">QUESTION</span><span class="flipTip">먼저 직접 말해보기</span></div><div class="flipCenter"><span class="chip">'+esc(q.topic.topic.en)+' · '+esc(q.topic.topic.ko)+'</span><p class="flipQuestion">'+esc(q.question.en)+'</p><p class="flipQuestionKo">'+esc(q.question.ko)+'</p><div class="tools"><button class="tool" data-speak-q>🔊 질문 듣기</button></div></div><button class="flipBtn" data-flip>모범답안 보기 →</button><p class="flipHint">막히면 바로 뒤집어도 괜찮아요. 몇 번이든 자유롭게 확인하세요.</p></section>'+
   '<section class="flipFace flipBack"><div class="flipTop"><span class="flipKicker">MODEL ANSWER</span><span class="flipTip">보고 · 듣고 · 따라 말하기</span></div><div class="answerTop"><div class="mini">'+levels.map(l=>'<button class="'+(l===level?'on':'')+'" data-level="'+l+'">'+l+'</button>').join('')+'</div><small style="color:var(--green);font-weight:800">'+(level===state.target?'내 목표':'')+'</small></div><div class="flipCenter"><p class="flipAnswer">'+esc(a.en)+'</p><p class="flipAnswerKo">'+esc(a.ko)+'</p><div class="tools"><button class="tool" data-speak-a>🔊 듣기</button><button class="tool" data-slow-a>0.8× 천천히</button></div></div><button class="flipBtn secondary" data-flip>← 질문으로 돌아가기</button><p class="flipHint">답을 본 뒤 다시 앞면으로 돌아가, 가능한 만큼 소리 내서 말해보세요.</p></section>'+
  '</div></div></div>'+
  '<section class="studyActions"><div class="actions"><button class="big primary" data-trainer>⌨️ 타이핑 학습 <small style="opacity:.82">(선택)</small></button><button class="big secondary" data-change>답변 방향 변경</button></div><div class="actions"><button class="big retry" data-rate="retry">다시 연습</button><button class="big success" data-rate="success">성공</button></div></section>';
 }
 shell('<div class="progress"><div style="width:'+pct+'%"></div></div>'+content,session.origin==='review'?'review':'topics')
}
function normType(x=''){return x.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}
function trainerNextSentence(){
 if(trainer.i+1<trainer.sentences.length){trainer.i++;trainer.input='';trainer.feedback=null;trainerView()}
 else{view='study';trainer=null;study()}
}
function trainerView(){
 const sentence=trainer.sentences[trainer.i];const meaning=trainer.koAligned?(trainer.koSentences[trainer.i]||trainer.koFull):trainer.koFull;
 const isLast=trainer.i+1>=trainer.sentences.length;
 let feedback='';
 if(trainer.feedback){
  feedback='<div class="trainerFeedback '+(trainer.feedback==='good'?'good':'bad')+'">'+(trainer.feedback==='good'?'정확해요!':'정답: '+esc(sentence))+'</div>';
  feedback+='<div class="trainerChoiceRow">'+(trainer.feedback==='bad'?'<button class="big secondary" data-retry-type>다시 입력</button>':'<button class="big secondary" data-close-trainer>모범답안 보기</button>')+'<button class="big primary" data-next-s>'+(isLast?'타이핑 학습 끝내기':'다음 문장')+'</button></div>';
 }
 shell('<div class="pageTitle"><button class="back" data-close-trainer>←</button><div><h1>타이핑 학습</h1><p>선택 학습 · '+(trainer.i+1)+' / '+trainer.sentences.length+'</p></div></div><section class="card trainerCard"><div class="trainerTop"><span class="trainerStep">Sentence '+(trainer.i+1)+'</span><span class="trainerStage">전체 문장 타이핑</span></div><div class="trainerPrompt"><p class="trainerSentence" style="font-size:18px;color:var(--muted)">모범답안을 본 뒤, 기억나는 문장을 직접 입력해 보세요.</p><div class="typingMeaning"><b>한국어 뜻</b><p>'+esc(meaning)+'</p></div><div class="tools"><button class="tool" data-speak-s>🔊 듣기</button><button class="tool" data-slow-s>0.8× 천천히</button></div><textarea class="typebox" id="typedPractice" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="영어 문장을 입력하세요.">'+esc(trainer.input||'')+'</textarea><p class="trainerHint">타이핑은 선택 학습이에요. 모범답안만 보고 넘어가도 됩니다.</p></div><button class="big primary trainerMain" data-check-type>정답 확인</button>'+feedback+'</section>',session.origin==='review'?'review':'topics')
}
function mark(kind){const q=cur(),k=q.id+'::'+path.id;state.review[k]={status:kind,updated:day()};const d=day();state.history[d]??={studied:0,success:0,retry:0};state.history[d].studied++;state.history[d][kind]++;save();toast(kind==='success'?'성공으로 저장했어요.':'다시 연습에 넣었어요.');setTimeout(nextQ,250)}
function nextQ(){if(session.index<session.ids.length-1){session.index++;session.reviewKey=null;path=null;level=state.target;qko=false;ako=false;flipSide='front';study()}else{const o=session.origin;session=null;flipSide='front';view=o==='review'?'review':'home';o==='review'?review():home()}}
function render(){if(view==='home')home();else if(view==='topics')topics();else if(view==='topic')topic();else if(view==='review')review();else if(view==='history')historyView();else if(view==='settings')settings();else if(view==='study')study();else if(view==='trainer')trainerView()}
document.addEventListener('click',e=>{
 const n=e.target.closest('[data-nav]');if(n){view=n.dataset.nav;session=null;path=null;render();return}
 if(e.target.closest('[data-settings]')){view='settings';settings();return}
 const targ=e.target.closest('[data-target]');if(targ){state.target=targ.dataset.target;level=state.target;save();render();return}
 const ac=e.target.closest('[data-accent]');if(ac){state.accent=ac.dataset.accent;state.voiceURI='';save();settings();return}
 if(e.target.closest('[data-preview-voice]')){speak("I usually use English when I study or travel.");return}
 const t=e.target.closest('[data-topic]');if(t){topicId=t.dataset.topic;view='topic';topic();return}
 const q=e.target.closest('[data-q]');if(q){start([q.dataset.q],'topics');return}
 const removeReview=e.target.closest('[data-remove-review]');if(removeReview){const k=removeReview.dataset.removeReview;if(state.review[k]){delete state.review[k];save();review();toast('복습 목록에서 제거했어요.')}return}
 const rv=e.target.closest('[data-review]');if(rv){start([rv.dataset.review.split('::')[0]],'review',rv.dataset.review);return}
 if(e.target.closest('[data-today]')){const ids=[...flat].sort(()=>Math.random()-.5).slice(0,5).map(q=>q.id);start(ids,'today');return}
 const p=e.target.closest('[data-path]');if(p){path=cur().paths.find(x=>x.id===p.dataset.path);level=state.target;flipSide='front';study();return}
 if(e.target.closest('[data-flip]')){flipSide=flipSide==='front'?'back':'front';const c=document.querySelector('.flipCard');if(c)c.classList.toggle('flipped',flipSide==='back');return}
 const l=e.target.closest('[data-level]');if(l){level=l.dataset.level;ako=false;study();return}
 if(e.target.closest('[data-qko]')){qko=!qko;study();return}
 if(e.target.closest('[data-ako]')){ako=!ako;study();return}
 if(e.target.closest('[data-speak-q]')){speak(cur().question.en);return}
 if(e.target.closest('[data-speak-a]')){speak(path.answers[level].en);return}
 if(e.target.closest('[data-slow-a]')){speak(path.answers[level].en,.72);return}
 if(e.target.closest('[data-change]')){path=null;ako=false;flipSide='front';study();return}
 const r=e.target.closest('[data-rate]');if(r){mark(r.dataset.rate);return}
 if(e.target.closest('[data-trainer]')){const a=path.answers[level];const ens=(a.en.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[a.en]).map(x=>x.trim()).filter(Boolean);const kos=(a.ko.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[a.ko]).map(x=>x.trim()).filter(Boolean);trainer={sentences:ens,koSentences:kos,koFull:a.ko,koAligned:ens.length===kos.length,i:0,input:'',feedback:null};view='trainer';trainerView();return}
 if(e.target.closest('[data-close-trainer]')){view='study';trainer=null;study();return}
 if(e.target.closest('[data-speak-s]')){speak(trainer.sentences[trainer.i]);return}
 if(e.target.closest('[data-slow-s]')){speak(trainer.sentences[trainer.i],.72);return}
 if(e.target.closest('[data-check-type]')){const v=document.getElementById('typedPractice')?.value||'';trainer.input=v;trainer.feedback=normType(v)===normType(trainer.sentences[trainer.i])?'good':'bad';trainerView();return}
 if(e.target.closest('[data-retry-type]')){trainer.input='';trainer.feedback=null;trainerView();return}
 if(e.target.closest('[data-next-s]')){trainerNextSentence();return}
});
document.addEventListener('change',e=>{
 if(e.target.id==='voiceSelect'){state.voiceURI=e.target.value||'';save();toast(state.voiceURI?'음성을 저장했어요.':'자동 음성 선택으로 바꿨어요.')}
});
if('speechSynthesis' in window){
 const prev=speechSynthesis.onvoiceschanged;
 speechSynthesis.onvoiceschanged=()=>{if(typeof prev==='function')prev();if(view==='settings')settings()}
}

render();
</script>
</body>
</html>
